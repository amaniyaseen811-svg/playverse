<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>If Clauses — أكاديمية إلمورا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080a11;
  --stone:#141a27;
  --stone-2:#1d2536;
  --parch:#f3e6c8;
  --parch-dim:#cbbb98;
  --gold:#d8a33f;
  --gold-soft:#f0cd82;
  --crimson:#8d2130;
  --spell:#8fd8ff;
  --curse:#57bd6a;
  --wrong:#c0392b;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--parch);
  font-family:'Tajawal',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:0;overflow-x:hidden;
}

body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(216,163,63,.13), transparent 60%),
    radial-gradient(900px 500px at 50% 110%, rgba(141,33,48,.14), transparent 60%);
}

/* ===== الإطار ===== */
.frame{
  position:relative;z-index:1;
  width:100%;max-width:760px;min-height:100dvh;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0d1119,#0a0d14);
}

/* ===== الشريط العلوي ===== */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:rgba(10,13,20,.9);
  border-bottom:1px solid rgba(216,163,63,.25);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);
}

.icon-btn{
  background:rgba(216,163,63,.1);
  border:1px solid rgba(216,163,63,.35);
  color:var(--gold-soft);
  width:36px;height:36px;border-radius:9px;
  font-size:15px;cursor:pointer;display:grid;place-items:center;
  transition:.2s;
}

.icon-btn:hover{background:rgba(216,163,63,.22)}
.icon-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.timer{
  font-family:'Cinzel',serif;font-size:14px;color:var(--gold-soft);
  padding:6px 12px;background:rgba(216,163,63,.1);
  border:1px solid rgba(216,163,63,.3);border-radius:6px;
  letter-spacing:1px;
}

.timer.warning{color:#ff9800;border-color:#ff9800}
.timer.critical{color:var(--wrong);border-color:var(--wrong)}

.lives{display:flex;gap:4px;font-size:17px;letter-spacing:1px}
.life{filter:drop-shadow(0 0 5px rgba(141,33,48,.9))}
.life.lost{opacity:.2;filter:grayscale(1)}

.spacer{flex:1}

.score{
  font-family:'Cinzel',serif;font-size:13px;color:var(--gold-soft);
  border:1px solid rgba(216,163,63,.3);border-radius:20px;padding:5px 12px;
  background:rgba(216,163,63,.07);
}

/* ===== المشهد ===== */
.stage{flex:1;display:flex;flex-direction:column}

.scene-wrap{
  position:relative;margin:12px 12px 0;padding:5px;
  border-radius:18px;overflow:hidden;
  background:#120f08;
  box-shadow:0 10px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(216,163,63,.35);
}

.scene-wrap .halo{
  position:absolute;top:50%;left:50%;width:190%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  background:conic-gradient(#d8a33f,#f7e3ad,#8d2130,#8fd8ff,#d8a33f);
  animation:spin 9s linear infinite;opacity:.85;
}

@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.scene-img{
  position:relative;width:100%;z-index:2;
  aspect-ratio:3/4;overflow:hidden;background:#0a0d14;
  border-radius:14px;display:flex;align-items:center;justify-content:center;
}

.scene-img .bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;filter:blur(22px) saturate(1.2) brightness(.55);
  transform:scale(1.25);
}

.scene-img .fg{
  position:absolute;inset:0;width:100%;height:100%;z-index:1;
  object-fit:contain;
  filter:drop-shadow(0 6px 24px rgba(0,0,0,.65));
  animation:fadeIn 1s ease-out both;
}

@keyframes fadeIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:scale(1)}}

/* ===== اللوح/المحتوى ===== */
.panel{
  flex:1;padding:18px 16px 30px;
  display:flex;flex-direction:column;gap:14px;
  animation:riseUp .5s ease-out both;
  overflow-y:auto;
}

@keyframes riseUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.narr{
  font-size:16.5px;line-height:1.85;color:var(--parch);
  background:rgba(243,230,200,.05);
  border-inline-start:3px solid var(--gold);
  border-radius:0 10px 10px 0;padding:13px 15px;
}

.narr strong{color:var(--gold-soft)}

.quest{
  font-family:'Cinzel',serif;direction:ltr;text-align:left;
  font-size:19px;line-height:1.7;color:#fff;
  background:linear-gradient(180deg,rgba(216,163,63,.14),rgba(216,163,63,.05));
  border:1px solid rgba(216,163,63,.4);border-radius:12px;
  padding:16px 18px;
}

.quest .blank{color:var(--gold);letter-spacing:2px}

.opts{display:flex;flex-direction:column;gap:9px}

.opt{
  display:flex;align-items:center;gap:12px;
  background:var(--stone);border:1px solid rgba(216,163,63,.22);
  border-radius:11px;padding:13px 15px;
  font-family:'Cinzel',serif;font-size:17px;color:var(--parch);
  cursor:pointer;transition:.18s;text-align:left;direction:ltr;width:100%;
}

.opt .tag{
  font-size:12px;width:24px;height:24px;flex:none;border-radius:6px;
  display:grid;place-items:center;
  background:rgba(216,163,63,.16);color:var(--gold-soft);
}

.opt:hover:not(:disabled){background:var(--stone-2);border-color:var(--gold);transform:translateX(-3px)}
.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.good{background:rgba(87,189,106,.16);border-color:var(--curse);color:#dcffe4}
.opt.bad{background:rgba(192,57,43,.16);border-color:var(--wrong);color:#ffdcd8}

.hint{
  font-size:14px;line-height:1.8;color:var(--parch-dim);
  background:rgba(143,216,255,.07);border:1px dashed rgba(143,216,255,.3);
  border-radius:10px;padding:11px 13px;
}

.hint b{color:var(--spell)}

.cta{
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:17px;
  background:linear-gradient(180deg,var(--gold),#b5822c);
  color:#1a1206;border:none;border-radius:11px;padding:14px;
  cursor:pointer;width:100%;transition:.2s;
  box-shadow:0 5px 20px rgba(216,163,63,.28);
}

.cta:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(216,163,63,.4)}
.cta:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.cta.dark{background:#1a1a1a;color:var(--parch);box-shadow:0 5px 20px rgba(0,0,0,.5)}
.cta.dark:hover{background:#252525}

/* ===== نمط اللعب ===== */
.modes{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin:10px 0;
}

.mode-btn{
  background:var(--stone);border:1px solid rgba(216,163,63,.2);
  border-radius:11px;padding:15px;
  color:var(--parch);cursor:pointer;
  text-align:center;font-weight:600;font-size:15px;
  transition:.2s;
}

.mode-btn:hover{background:var(--stone-2);border-color:var(--gold)}
.mode-btn.active{background:var(--gold);color:#1a1206;border-color:var(--gold)}

/* ===== معلومات المرحلة ===== */
.stage-info{
  display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;
  margin:10px 0;
}

.info-card{
  background:rgba(216,163,63,.08);border:1px solid rgba(216,163,63,.25);
  border-radius:9px;padding:12px;text-align:center;font-size:13px;
}

.info-card .label{color:var(--parch-dim);font-size:11px;text-transform:uppercase;letter-spacing:0.5px}
.info-card .value{color:var(--gold-soft);font-size:16px;font-weight:700;margin-top:4px}

/* ===== زر الإيقاف الطارئ ===== */
.emergency-pause{
  position:fixed;bottom:20px;right:20px;width:56px;height:56px;
  border-radius:50%;background:linear-gradient(135deg,var(--crimson),#a01840);
  border:2px solid var(--gold);color:#fff;
  cursor:pointer;z-index:30;display:grid;place-items:center;
  font-size:24px;box-shadow:0 4px 20px rgba(141,33,48,.5);
  transition:.2s;
  animation:pulse 2s ease-in-out infinite;
}

.emergency-pause:hover{transform:scale(1.1);box-shadow:0 6px 30px rgba(141,33,48,.8)}
.emergency-pause:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

@keyframes pulse{0%,100%{box-shadow:0 4px 20px rgba(141,33,48,.5)}50%{box-shadow:0 6px 30px rgba(141,33,48,.8)}}

/* ===== المودال ===== */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.8);
  display:none;align-items:center;justify-content:center;
  z-index:50;animation:fadeIn .3s ease-out;
}

.modal.show{display:flex}

.modal-content{
  background:linear-gradient(180deg,#0d1119,#0a0d14);
  border:1px solid rgba(216,163,63,.4);border-radius:16px;
  padding:30px;max-width:500px;width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,.8);
  animation:slideUp .3s ease-out;
}

@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}

.modal-title{
  font-family:'Cinzel',serif;font-size:22px;color:var(--gold-soft);
  margin-bottom:15px;text-align:center;
}

.modal-body{
  font-size:15px;line-height:1.8;color:var(--parch);
  margin-bottom:20px;
}

.modal-actions{
  display:flex;gap:10px;
}

.modal-actions button{
  flex:1;padding:12px;border:none;border-radius:9px;
  cursor:pointer;font-weight:600;font-size:14px;transition:.2s;
}

.btn-continue{
  background:var(--gold);color:#1a1206;
}

.btn-continue:hover{background:#f0cd82}

.btn-cancel{
  background:var(--stone);color:var(--parch);border:1px solid rgba(216,163,63,.3);
}

.btn-cancel:hover{background:var(--stone-2)}

/* ===== شاشة الغلاف ===== */
.cover-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:30px;padding:40px 20px;text-align:center;
}

.cover-title{
  font-family:'Cinzel',serif;font-size:48px;font-weight:700;
  color:var(--gold-soft);letter-spacing:2px;
  text-shadow:0 4px 20px rgba(216,163,63,.3);
}

.cover-subtitle{
  font-size:18px;color:var(--parch-dim);
}

.start-btn{
  padding:16px 40px;font-size:18px;
  background:linear-gradient(135deg,var(--gold),#f0cd82);
  color:#1a1206;border:none;border-radius:12px;
  cursor:pointer;font-weight:700;
  box-shadow:0 8px 30px rgba(216,163,63,.4);
  transition:.3s;
}

.start-btn:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(216,163,63,.6)}

/* ===== شاشة النتائج ===== */
.results-screen{
  display:flex;flex-direction:column;align-items:center;gap:20px;padding:30px 20px;
}

.medal{
  font-size:80px;margin:20px 0;
}

.results-title{
  font-family:'Cinzel',serif;font-size:28px;color:var(--gold-soft);
}

.results-data{
  display:grid;grid-template-columns:1fr 1fr;gap:15px;width:100%;max-width:400px;
}

.result-item{
  background:rgba(216,163,63,.1);border:1px solid rgba(216,163,63,.3);
  border-radius:9px;padding:15px;text-align:center;
}

.result-label{font-size:12px;color:var(--parch-dim);text-transform:uppercase;letter-spacing:0.5px}
.result-value{font-size:20px;font-weight:700;color:var(--gold-soft);margin-top:5px}

/* ===== الفيديو ===== */
.video-container{
  width:100%;background:#000;border-radius:12px;overflow:hidden;
  margin:15px 0;
}

video{width:100%;height:auto;display:block}

/* ===== أوراق العمل ===== */
.wsheet{
  display:flex;flex-direction:column;gap:12px;margin:15px 0;
}

.wsbtn{
  display:flex;align-items:center;gap:15px;
  background:var(--stone);border:1px solid rgba(216,163,63,.2);
  border-radius:11px;padding:15px;color:var(--parch);cursor:pointer;
  transition:.2s;text-align:left;
}

.wsbtn:hover{background:var(--stone-2);border-color:var(--gold)}
.wsbtn .n{
  font-family:'Cinzel',serif;font-size:24px;font-weight:700;color:var(--gold-soft);
  flex:none;
}

.wsbtn span{flex:1}
.wsbtn small{
  display:block;font-size:12px;color:var(--parch-dim);margin-top:4px;
}

/* ===== الهدايا ===== */
.gifts{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0;
}

.gift{
  width:70px;height:70px;border:2px solid rgba(216,163,63,.3);
  border-radius:9px;background:rgba(216,163,63,.1);
  cursor:pointer;font-size:32px;display:grid;place-items:center;
  transition:.3s;
}

.gift:hover:not(:disabled){background:rgba(216,163,63,.2);transform:scale(1.05)}
.gift:disabled{cursor:default;opacity:.5}

.giftout{
  font-size:16px;background:rgba(87,189,106,.15);
  border:1px solid var(--curse);border-radius:10px;padding:15px;
  text-align:center;color:#dcffe4;font-weight:600;
}

/* ===== الحالات الخاصة ===== */
.pause-display{
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:15px;
}

.pause-display.active{display:flex}

.countdown{
  font-size:72px;font-family:'Cinzel',serif;
  color:var(--gold-soft);font-weight:700;
}

@media (max-width:480px){
  .stage-info{grid-template-columns:1fr 1fr}
  .modes{grid-template-columns:1fr}
  .cover-title{font-size:36px}
  .results-data{grid-template-columns:1fr}
  .gifts{grid-template-columns:repeat(3,1fr)}
}

</style>
</head>
<body>

<div class="frame">
  <!-- الشريط العلوي -->
  <div class="topbar" id="topbar">
    <button class="icon-btn" id="btnHome" title="الرئيسية">🏠</button>
    <button class="icon-btn" id="btnRule" title="التعليمات">📖</button>
    <button class="icon-btn" id="btnSound" title="الصوت">🔊</button>
    <div class="timer" id="timer">30:00</div>
    <div class="spacer"></div>
    <div class="lives" id="lives"></div>
    <div class="score" id="score">💎 0</div>
  </div>

  <!-- المشهد والمحتوى -->
  <div class="stage" id="stage"></div>
</div>

<!-- المودالات -->
<div class="modal" id="pauseModal">
  <div class="modal-content">
    <div class="modal-title">إيقاف مؤقت</div>
    <div class="modal-body" id="pauseBody"></div>
    <div class="modal-actions">
      <button class="btn-continue" onclick="resumeGame()">متابعة</button>
      <button class="btn-cancel" onclick="returnToHome()">الرئيسية</button>
    </div>
  </div>
</div>

<!-- زر الإيقاف الطارئ -->
<button class="emergency-pause" id="emergencyBtn" title="إيقاف طارئ" style="display:none">⏸</button>

<audio id="bgm" loop>
  <source src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQIAAAAAAA==" type="audio/wav">
</audio>

<script>
(function(){

// ===== المتغيرات الأساسية =====
var GAME_STATE={
  mode:'solo',
  level:'secondary',
  lives:3,
  points:0,
  startTime:0,
  timeRemaining:1800000,
  pauseTime:0,
  isPaused:false,
  emergencyUsed:false,
  sound:true,
  currentStage:0,
  completed:false
};

var STAGES=[
  {
    type:'type1',
    intro:'اختبري حكمتك… <strong>الأسئلة تبدأ.</strong>',
    img:'elmora-circle.jpg',
    q:'If I _____ you earlier, I would have warned you.',
    opts:['had seen','saw','would see'],
    correct:0,
    winTxt:'✓ ممتاز! أنتِ فاهمة القاعدة بشكل صحيح.',
    badTxt:'✗ ليست هاي الإجابة الصحيحة.',
    hint:'<b>القاعدة:</b> في الجملة الشرطية الثالثة (Mixed Conditional)، نستخدم Past Perfect بعد If عندما يكون الفعل الرئيسي في الماضي.'
  },
  {
    type:'type1',
    intro:'السؤال التاني ينتظرك…',
    img:'elmora-circle.jpg',
    q:'If I were you, I _____ this job immediately.',
    opts:['would take','take','will take'],
    correct:0,
    winTxt:'✓ أحسنتِ! استمري بهاي الطريقة.',
    badTxt:'✗ الإجابة المختارة غير صحيحة.',
    hint:'<b>التفسير:</b> في الشرط الثاني (Second Conditional)، نستخدم would + verb base form في الجزء الرئيسي من الجملة.'
  },
  {
    type:'type2',
    intro:'تقتربين من النهاية…',
    img:'elmora-circle.jpg',
    q:'If you _____ me, would you forgive me?',
    opts:['see','saw','had seen'],
    correct:1,
    winTxt:'✓ صحيح تماماً! أنتِ متقنة لـ Second Conditional.',
    badTxt:'✗ حاولي مرة أخرى… استفكري بـ Second Conditional.',
    hint:'<b>القاعدة:</b> Second Conditional = If + Past Simple, would + base verb. إنه شرط وهمي في الحاضر.'
  }
];

var TYPE_LABEL={'type1':'الشرط الأول','type2':'الشرط الثاني'};

// ===== عناصر الـ DOM =====
var stage=document.getElementById('stage');
var topbar=document.getElementById('topbar');
var timerEl=document.getElementById('timer');
var livesEl=document.getElementById('lives');
var scoreEl=document.getElementById('score');
var bgm=document.getElementById('bgm');
var pauseModal=document.getElementById('pauseModal');
var emergencyBtn=document.getElementById('emergencyBtn');

// ===== وظائف اساسية =====
function el(tag,cls,html){
  var e=document.createElement(tag);
  if(cls)e.className=cls;
  if(html)e.innerHTML=html;
  return e;
}

function paint(nodes){
  stage.innerHTML='';
  nodes.forEach(function(n){stage.appendChild(n)});
}

function updateHUD(){
  // تحديث الأرواح
  livesEl.innerHTML='';
  for(var i=0;i<3;i++){
    var heart=el('span','life',i<GAME_STATE.lives?'❤️':'❌');
    livesEl.appendChild(heart);
  }
  // تحديث النقاط
  scoreEl.textContent='💎 '+GAME_STATE.points;
}

// ===== نظام المؤقت =====
var timerInterval=null;

function startTimer(){
  GAME_STATE.startTime=Date.now();
  timerInterval=setInterval(function(){
    if(GAME_STATE.isPaused)return;
    
    var elapsed=Date.now()-GAME_STATE.startTime;
    var remaining=1800000-elapsed;
    
    if(remaining<=0){
      endGameByTime();
      return;
    }
    
    var mins=Math.floor(remaining/60000);
    var secs=Math.floor((remaining%60000)/1000);
    var display=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
    
    timerEl.textContent=display;
    
    if(remaining<=300000)timerEl.classList.add('warning');
    if(remaining<=60000)timerEl.classList.add('critical');
  },100);
}

function endGameByTime(){
  clearInterval(timerInterval);
  var p=el('div','panel');
  p.appendChild(el('div','narr','انتهت المهلة الزمنية!'));
  var b=el('button','cta','من البداية');
  b.onclick=reset;
  p.appendChild(b);
  paint([p]);
}

// ===== نظام الإيقاف الطارئ =====
var pauseCountdown=0;
var pauseMax=20;

function activateEmergency(){
  if(GAME_STATE.emergencyUsed||GAME_STATE.isPaused)return;
  
  GAME_STATE.emergencyUsed=true;
  GAME_STATE.isPaused=true;
  pauseCountdown=pauseMax;
  emergencyBtn.style.opacity='0.3';
  
  var body=document.getElementById('pauseBody');
  body.innerHTML='<div class="pause-display active"><div class="countdown">'+pauseCountdown+'</div><p>ثانية للتفكير</p></div>';
  pauseModal.classList.add('show');
  
  var countInterval=setInterval(function(){
    pauseCountdown--;
    document.querySelector('.countdown').textContent=pauseCountdown;
    if(pauseCountdown<=0){
      clearInterval(countInterval);
      resumeGame();
    }
  },1000);
}

function resumeGame(){
  GAME_STATE.isPaused=false;
  pauseModal.classList.remove('show');
  GAME_STATE.startTime=Date.now();
}

function returnToHome(){
  if(confirm('تريدين العودة للرئيسية؟')){
    reset();
  }
}

// ===== اختيار نمط اللعب =====
function screenModes(){
  var p=el('div','panel');
  p.appendChild(el('div','narr','اختاري نمط اللعب:'));

// ===== المراحل الرئيسية =====
function screenStage(i){
  GAME_STATE.currentStage=i;
  if(i>=STAGES.length)return screenDuelIntro();
  
  var G=STAGES[i];
  var p=el('div','panel');
  p.appendChild(el('div','narr',G.intro));
  p.appendChild(el('div','quest',questionHTML(G.q)));
  
  var box=el('div','opts');
  var tags=['A','B','C'];
  G.opts.forEach(function(txt,j){
    var b=el('button','opt','<span class="tag">'+tags[j]+'</span>'+txt);
    b.onclick=function(){answerStage(i,j,box,p)};
    box.appendChild(b);
  });
  
  p.appendChild(box);
  paint([createScene(G.img,TYPE_LABEL[G.type]),p]);
}

function questionHTML(txt){
  return '<span>'+txt+'</span>';
}

function answerStage(i,j,box,p){
  var G=STAGES[i];
  var bs=box.querySelectorAll('.opt');
  for(var k=0;k<bs.length;k++)bs[k].disabled=true;
  
  if(j===G.correct){
    bs[j].classList.add('good');
    GAME_STATE.points+=30;updateHUD();
    setTimeout(function(){
      var p2=el('div','panel');
      p2.appendChild(el('div','narr','✓ '+G.winTxt));
      p2.appendChild(el('div','hint',G.hint));
      var b=el('button','cta',i===STAGES.length-1?'المواجهة الأخيرة':'التحدي التالي');
      b.onclick=function(){screenStage(i+1)};
      p2.appendChild(b);
      paint([createScene(G.img,'أحسنت'),p2]);
    },520);
  }else{
    bs[j].classList.add('bad');bs[G.correct].classList.add('good');
    GAME_STATE.lives--;updateHUD();
    setTimeout(function(){
      if(GAME_STATE.lives<=0)return screenGameOver();
      var p2=el('div','panel');
      p2.appendChild(el('div','narr','✗ '+G.badTxt));
      p2.appendChild(el('div','hint',G.hint));
      var b=el('button','cta dark','حاول مرة ثانية');
      b.onclick=function(){screenStage(i)};
      p2.appendChild(b);
      paint([createScene(G.img,'خسرتِ نجمة'),p2]);
    },520);
  }
}

// ===== المواجهة الأخيرة =====
function screenDuelIntro(){
  var p=el('div','panel');
  p.appendChild(el('div','narr','أحسنتِ… وصلتِ للنهاية.<br><br>الآن: ما هو الشرط الصحيح في هاي الجملة؟'));
  var box=el('div','opts');
  var opts=['Second Conditional','First Conditional','Third Conditional'];
  var tags=['A','B','C'];
  opts.forEach(function(txt,i){
    var b=el('button','opt','<span class="tag">'+tags[i]+'</span>'+txt);
    b.onclick=function(){castSpell(i,box,p)};
    box.appendChild(b);
  });
  p.appendChild(box);
  paint([createScene('','المواجهة الأخيرة'),p]);
}

function castSpell(i,box,p){
  var bs=box.querySelectorAll('.opt');
  for(var k=0;k<bs.length;k++)bs[k].disabled=true;
  if(i===0){
    bs[0].classList.add('good');
    GAME_STATE.points+=30;updateHUD();
    setTimeout(screenCup,600);
  }else{
    bs[i].classList.add('bad');
    GAME_STATE.lives--;updateHUD();
    if(GAME_STATE.lives<=0)return setTimeout(screenGameOver,520);
    p.appendChild(el('div','hint','✗ الجواب الصحيح هو Second Conditional.'));
    var b=el('button','cta dark','جرّبي مرة ثانية');
    b.onclick=screenDuelIntro;p.appendChild(b);
  }
}

function screenWorksheet1(){
  var p=el('div','panel');
  p.appendChild(el('div','narr','<strong>ورقة العمل الأولى</strong>'));
  
  var worksheet=el('div','hint');
  worksheet.innerHTML=`
    <b>تمارين If Clauses — مستوى متقدم (1)</b><br><br>
    <b style="color:#ff9800">التمرين 1: ملء الفراغات بالصيغة الصحيحة</b><br>
    1. If she _____ (not/pass) the exam, she _____ (retake) it next month.<br>
    2. Unless you _____ (practice) regularly, you _____ (not/improve) your English.<br>
    3. Had I known about the party, I _____ (attend) it with pleasure.<br>
    4. If the weather _____ (be) nicer, we _____ (go) to the beach yesterday.<br>
    5. Were it not for your help, I _____ (not/complete) the project.<br><br>
    
    <b style="color:#ff9800">التمرين 2: تحديد نوع الشرط</b><br>
    اكتبي نوع الشرط (First, Second, Third, Mixed):<br>
    6. If you had studied harder, you would get better grades now.<br>
    7. If I win the lottery, I will travel around the world.<br>
    8. If she were rich, she would have bought that house.<br>
    9. If they had told me the truth, I would trust them today.<br>
    10. If global warming continues, weather patterns will change drastically.<br><br>
    
    <b style="color:#57bd6a">الأجوبة:</b><br>
    <b>التمرين 1:</b><br>
    1. doesn't pass / will retake (First Conditional)<br>
    2. don't practice / won't improve (First Conditional)<br>
    3. would have attended (Third Conditional)<br>
    4. had been / we could have gone (Mixed Conditional)<br>
    5. would not have completed (Third Conditional)<br><br>
    <b>التمرين 2:</b><br>
    6. Mixed Conditional (Third + Second)<br>
    7. First Conditional<br>
    8. Mixed Conditional (Second + Third)<br>
    9. Mixed Conditional (Third + Second)<br>
    10. First Conditional
  `;
  p.appendChild(worksheet);
  
  var b=el('button','cta','رجوع');
  b.onclick=screenWorksheets;p.appendChild(b);
  paint([p]);
}

function screenWorksheet2(){
  var p=el('div','panel');
  p.appendChild(el('div','narr','<strong>ورقة العمل الثانية — صعب جداً!</strong>'));
  
  var worksheet=el('div','hint');
  worksheet.innerHTML=`
    <b style="color:#ff0000">تمارين متقدمة جداً — المستوى الخبير</b><br><br>
    
    <b style="color:#ff9800">التمرين 1: تصحيح الأخطاء المعقدة (6 أخطاء)</b><br>
    1. If she would have known the consequences, she would not do it. <span style="color:#ff0000">❌❌</span><br>
       الصحيح: If she had known the consequences, she would not have done it.<br>
       <small>خطأ 1: "would have known" ❌ يجب "had known"</small><br>
       <small>خطأ 2: "would not do" ❌ يجب "would not have done"</small><br><br>
    
    2. If I were you, I would have accepted the job offer yesterday. <span style="color:#ff0000">❌</span><br>
       الصحيح: If I had been in your position, I would have accepted the job offer yesterday. (Mixed Conditional)<br>
       <small>التصحيح: هذا Mixed Conditional (Third+Second) يحتاج "had been" وليس "were"</small><br><br>
    
    3. Unless you don't study hard, you will pass the exam. <span style="color:#ff0000">❌</span><br>
       الصحيح: Unless you study hard, you will fail the exam. (أو: If you don't study hard...)<br>
       <small>خطأ: النفي المزدوج "don't" مع "unless" غير صحيح</small><br><br>
    
    4. If he hadn't been late, the meeting would have been started on time. <span style="color:#ff0000">❌</span><br>
       الصحيح: If he hadn't been late, the meeting would have started on time.<br>
       <small>خطأ: "would have been started" (بناء مجهول خاطئ) يجب "would have started"</small><br><br>
    
    5. Had you told me earlier, I could have helped you with your project. <span style="color:#ff0000">❌❌</span><br>
       الصحيح: الجملة صحيحة تماماً! ✓ (Inversion of Third Conditional)<br>
       <small>هذه صيغة معكوسة صحيحة (Inverted Conditional)</small><br><br>
    
    6. If I was rich, I will donate money to charity. <span style="color:#ff0000">❌❌</span><br>
       الصحيح: If I were rich, I would donate money to charity.<br>
       <small>خطأ 1: "was" ❌ يجب "were" (Subjunctive)</small><br>
       <small>خطأ 2: "will donate" ❌ يجب "would donate" (Second Conditional)</small><br><br>
    
    <b style="color:#ff9800">التمرين 2: ترجمة من العربية مع If Clauses</b><br>
    7. لو كان لديّ المال، كنت سأشتري بيتاً. (عبّري بـ If Clause)<br>
       الإجابة: If I had the money, I would buy a house.<br><br>
    
    8. لو كانوا قد أخبروا الشرطة، لكانت اللصوص قد تم اعتقالهم.<br>
       الإجابة: If they had told the police, the thieves would have been arrested.<br><br>
    
    <b style="color:#ff9800">التمرين 3: إعادة صياغة بدون تغيير المعنى</b><br>
    9. في حالة عدم وصول المساعدة، ستفشل المهمة.<br>
       أعيدي الصياغة: If the assistance doesn't arrive, the mission will fail. / Unless the assistance arrives, the mission will fail.<br><br>
    
    10. يمكنك النجاح إذا وإذا فقط إذا كنت ستركزين. (Mixed + Emphasis)<br>
        الإجابة: You can only succeed if you focus. / If you don't focus, you cannot succeed. / Should you fail to focus, you will not succeed.
  `;
  p.appendChild(worksheet);
  
  var b=el('button','cta','رجوع');
  b.onclick=screenWorksheets;p.appendChild(b);
  paint([p]);
}

// ===== النتائج النهائية =====
function screenResults(){
  clearInterval(timerInterval);
  var elapsed=Math.floor((Date.now()-GAME_STATE.startTime)/1000);
  var mins=Math.floor(elapsed/60);
  var secs=elapsed%60;
  
  var medal='🥉';
  if(GAME_STATE.points>=80)medal='🥇';
  else if(GAME_STATE.points>=60)medal='🥈';
  
  var p=el('div','results-screen');
  p.appendChild(el('div','medal',medal));
  p.appendChild(el('div','results-title','النتائج النهائية'));
  
  var data=el('div','results-data');
  data.appendChild(createResultItem('النقاط',GAME_STATE.points+'/'+STAGES.length*30));
  data.appendChild(createResultItem('الوقت',mins+'د '+secs+'ث'));
  data.appendChild(createResultItem('الأرواح المتبقية',GAME_STATE.lives+'/3'));
  data.appendChild(createResultItem('التقييم',GAME_STATE.points>=80?'ممتاز':'جيد'));
  
  p.appendChild(data);
  
  var btn=el('button','cta','الهدية المميزة');
  btn.onclick=screenVictory;p.appendChild(btn);
  
  paint([p]);
}

function createResultItem(label,value){
  var item=el('div','result-item');
  item.appendChild(el('div','result-label',label));
  item.appendChild(el('div','result-value',value));
  return item;
}

var GIFTS=['🏅 ربحتِ علامتين إضافيتين!','🤝 تقدري تساعدي صديقتك!','🎁 هدية مميزة من معلمتك!','⭐ رح تكوني من نجوم الأسبوع!'];

function screenVictory(){
  var p=el('div','panel');
  p.appendChild(el('div','narr','🧙‍♂️ المارد يمنحك جائزة… اختاري صندوق واحد!'));
  
  var box=el('div','gifts');
  var order=GIFTS.slice();
  for(var k=order.length-1;k>0;k--){var r=Math.floor(Math.random()*(k+1));var t=order[k];order[k]=order[r];order[r]=t;}
  
  var picked=false;
  order.forEach(function(txt){
    var g=el('button','gift','🎁');
    g.onclick=function(){
      if(picked)return;picked=true;

      var b2=el('button','cta','من جديد');
      b2.onclick=reset;p.appendChild(b2);
    };
    box.appendChild(g);
  });
  
  p.appendChild(box);
  paint([p]);
}

// ===== شاشة القواعد =====
function screenRules(from){
  var p=el('div','panel');
  p.appendChild(el('div','narr','<strong>قواعد If Clauses</strong>'));
  
  var rules=el('div','hint');
  rules.innerHTML=`
    <b>أنواع الشروط الثلاثة:</b><br><br>
    1️⃣ <b>First Conditional:</b><br>
    If + Present Simple → will + base verb<br>
    "If you come, I will be happy."<br><br>
    2️⃣ <b>Second Conditional:</b><br>
    If + Past Simple → would + base verb<br>
    "If you came, I would be happy."<br><br>
    3️⃣ <b>Third Conditional:</b><br>
    If + Past Perfect → would have + past participle<br>
    "If you had come, I would have been happy."
  `;
  p.appendChild(rules);
  
  var b=el('button','cta',from==='cover'?'ابدئي اللعبة':'رجوع');
  b.onclick=function(){from==='cover'?screenModes():window.history.back()};
  p.appendChild(b);
  
  if(from!=='cover')topbar.style.display='none';
  paint([p]);
}

// ===== المشهد =====
function createScene(img,label){
  var wrap=el('div','scene-wrap');
  wrap.appendChild(el('div','halo'));
  
  var scene=el('div','scene-img');
  scene.appendChild(el('div','bg'));
  var fg=el('img','fg');fg.src=img||'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300"%3E%3Crect fill="%23333" width="200" height="300"/%3E%3Ctext x="100" y="150" fill="%23999" text-anchor="middle" font-size="20"%3E'+label+'%3C/text%3E%3C/svg%3E';
  scene.appendChild(fg);
  
  wrap.appendChild(scene);
  return wrap;
}
