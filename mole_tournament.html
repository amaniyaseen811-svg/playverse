  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  body {
    font-family: 'Tajawal', sans-serif;
    background: #0a1f3d;
    color: #fff;
    direction: rtl;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
  }
  body[data-lang="en"], body[data-lang="fr"], body[data-lang="es"], 
  body[data-lang="tr"], body[data-lang="pt"], body[data-lang="de"] { 
    direction: ltr;
    font-family: 'Roboto', sans-serif;
  }
  body[data-lang="zh"] {
    direction: ltr;
    font-family: 'SimHei', 'Heiti TC', 'Microsoft YaHei', sans-serif;

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* ===== Stadium Background ===== */
  .stadium-bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,215,0,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 0% 100%, rgba(30,80,200,0.25) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgba(200,60,30,0.2) 0%, transparent 50%),
      linear-gradient(180deg, #0a1f3d 0%, #0d2851 40%, #0a1f3d 100%);
    pointer-events: none;
  }
  .stadium-bg::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.06) 1px, transparent 1px),
      radial-gradient(circle at 75% 20%, rgba(255,255,255,0.04) 1px, transparent 1px),
      radial-gradient(circle at 50% 80%, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 30px 30px, 50px 50px, 40px 40px;
    opacity: 0.6;
    animation: twinkle 8s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.3; } to { opacity: 0.7; } }

  /* ===== Language Selector ===== */
  #langSelector {
    position: fixed;
    top: max(8px, env(safe-area-inset-top));
    left: 8px;
    z-index: 100;
    background: rgba(255,215,0,0.15);
    border: 2px solid rgba(255,215,0,0.4);
    border-radius: 50px;
    padding: 6px 12px;
    backdrop-filter: blur(10px);
  }
  #langSelector select {
    background: transparent;
    color: #ffd700;
    font-weight: 700;
    font-size: 13px;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
  }
  #langSelector select option {
    background: #0a1f3d;
    color: #fff;
  }

  /* ===== App Container ===== */
  #app {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    max-width: 480px; margin: 0 auto;
    padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
  }

  /* ===== Screens ===== */
  .screen {
    display: none; flex-direction: column; flex: 1; width: 100%;
    animation: fadeIn 0.4s ease;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 28px;
    scrollbar-width: thin;
  }
  .screen::-webkit-scrollbar { width: 5px; }
  .screen::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.22); border-radius: 4px; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  #screen-home { justify-content: space-between; align-items: center; padding: 20px 12px; gap: 16px; }
  .trophy-glow {
    font-size: 90px; line-height: 1;
    filter: drop-shadow(0 0 30px rgba(255,215,0,0.7));
    animation: trophy 3s ease-in-out infinite;
  }
  @keyframes trophy { 0%, 100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.05) rotate(2deg); } }

    font-family: 'Cairo', serif;
    font-size: clamp(28px, 8vw, 40px);
    font-weight: 900;
    background: linear-gradient(180deg, #ffd700 0%, #ffaa00 70%, #cc7700 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center; line-height: 1.2;
    text-shadow: 0 4px 20px rgba(255,170,0,0.3);
    letter-spacing: -0.5px;
  }
  .title-sub {
    color: #b8c7e0; text-align: center; font-size: 15px;
    margin-top: 6px; line-height: 1.5; max-width: 320px;
  }
  .home-media {
    width: 100%; max-width: 360px; aspect-ratio: 3/2;
    border-radius: 18px; position: relative; overflow: hidden;
    border: 3px solid #ffd700;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,215,0,0.3) inset;
    background-size: cover;
    background-position: center;
    background-color: #1a3a6f;
  }
  .home-media img, .home-media video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .home-media::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 0%, transparent 60%, rgba(10,31,61,0.6) 100%);
    pointer-events: none;
  }
  .home-buttons { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }

    background: linear-gradient(180deg, #ffd700 0%, #ffaa00 100%);
    color: #0a1f3d; font-weight: 900; font-size: 22px;
    padding: 18px 28px; border-radius: 50px;
    box-shadow: 0 6px 0 #cc7700, 0 10px 30px rgba(255,170,0,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #cc7700, 0 5px 15px rgba(255,170,0,0.3); }
  .btn-secondary {
    background: rgba(255,255,255,0.08); color: #fff; font-weight: 700; font-size: 15px;
    padding: 12px 20px; border-radius: 50px;
    border: 1.5px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
  }
  .btn-secondary:active { background: rgba(255,255,255,0.15); }

    padding: 20px 12px;
    gap: 16px;
  }

    width: 100%;

    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,215,0,0.3);
    border-radius: 18px;
    padding: 24px;
    backdrop-filter: blur(10px);
  }
  .info-title {
    font-size: 24px;
    font-weight: 900;
    color: #ffd700;
    margin-bottom: 16px;
  }
  .info-item {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    padding: 8px;
    border-radius: 8px;
    background: rgba(255,215,0,0.08);
  }
  .info-item-text {
    color: #b8c7e0;
    font-size: 14px;
    line-height: 1.6;

  .back-btn {
    background: rgba(255,215,0,0.2);
    color: #ffd700;
    padding: 12px 20px;
    border-radius: 50px;
    font-weight: 700;
    border: 1.5px solid rgba(255,215,0,0.4);
  }
  .back-btn:active {

  }

    background: rgba(0,0,0,0.8);

    padding: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;

  #wsOverlay.on {
    opacity: 1;
    pointer-events: auto;
  }
  .ws-wrap {
    background: linear-gradient(180deg, rgba(10,31,61,0.95) 0%, rgba(13,40,81,0.95) 100%);
    border: 2px solid rgba(255,215,0,0.4);
    border-radius: 20px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);

  .ws-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; gap: 12px;

  .ws-badge {
    background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);

    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 12px;

  .ws-count {

    font-size: 12px;
    font-weight: 700;
  }
  .ws-bar {

    height: 6px;
    background: rgba(255,215,0,0.1);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 20px;

  .ws-bar i {

    height: 100%;
    background: linear-gradient(90deg, #ffd700, #ffaa00);

    border-radius: 3px;

    font-weight: 700;
    color: #ffd700;
    margin-bottom: 16px;

    font-weight: 600;
    font-size: 15px;

    border-color: rgba(255,215,0,0.4);

    color: #f44336;
  }

    font-size: 13px;
    color: #e8d699;
    line-height: 1.6;
    margin: 16px 0;

  .ws-note b {
    color: #ffd700;
    display: block;
    margin-bottom: 6px;
  }
  .ws-score {

    color: #b8c7e0;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 16px;
  }

    display: flex;
    gap: 10px;
    justify-content: center;
  }

    padding: 12px 24px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 14px;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    flex: 1;

  .ws-next:active { transform: scale(0.95); }
  .ws-next:disabled { opacity: 0.45; cursor: not-allowed; }
  .ws-close {

    color: #fff;

    padding: 20px 0;

    margin-bottom: 16px;
  }

    font-size: 20px;
    color: #ffd700;
    margin-bottom: 12px;
  }
  .ws-done p {
    color: #b8c7e0;
    font-size: 14px;
    margin-bottom: 8px;
    line-height: 1.6;
  }
  .ws-done b { color: #ffd700; }

  // ===== Language Management =====
  let currentLang = localStorage.getItem('molLang') || 'ar';

  function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('molLang', lang);
    document.documentElement.lang = lang;
    document.body.setAttribute('data-lang', lang);
    document.body.dir = ['ar'].includes(lang) ? 'rtl' : 'ltr';
    updateTranslations();
    updateCoverImage();
  }

  function t(key) {
    return translations[currentLang] && translations[currentLang][key] || translations.ar[key] || key;
  }

  function updateTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      el.textContent = t(key);
    });
    if (ovl && ovl.classList.contains('on')) {
      render();
    }
  }

  function updateCoverImage() {
    // في بيئة الإنتاج، استخدمي الصور المولدة
    // const coverImg = document.getElementById('coverImage');
    // coverImg.src = `images/cover_${currentLang}.png`;
  }

  // ===== Worksheet State =====
  let ovl;
  let W = { sheet: 1, i: 0, score: 0, total: 0, locked: false, done: false };

  function getQuestions() {
    return questions[currentLang][W.sheet === 1 ? 'ws1' : 'ws2'];
  }

  // ===== Build & Render =====
  function build() {
    if (ovl) return;
    ovl = document.createElement('div');
    ovl.id = 'wsOverlay';
    ovl.innerHTML =
      '<div class="ws-wrap">' +
        '<div class="ws-head">' +
          '<span class="ws-badge" id="wsTitle"></span>' +
          '<span class="ws-count" id="wsCount"></span>' +
        '</div>' +
        '<div class="ws-bar"><i id="wsBar"></i></div>' +
        '<div id="wsPane"></div>' +
        '<div class="ws-score" id="wsScore"></div>' +
      '</div>';
    document.body.appendChild(ovl);
  }

  function open() {
    build();
    W = { sheet: 1, i: 0, score: 0, total: 0, locked: false, done: false };
    ovl.classList.add('on');
    ovl.scrollTop = 0;
    render();
  }

  function close() {
    if (ovl) ovl.classList.remove('on');
  }

  function render() {
    const L = getQuestions();
    const it = L[W.i];
    W.locked = false;
    
    const titleText = W.sheet === 1 ? t('ws1Title') : t('ws2Title');
    document.getElementById('wsTitle').textContent = titleText;
    document.getElementById('wsCount').textContent = (W.i + 1) + ' / ' + L.length;
    document.getElementById('wsBar').style.width = (W.i / L.length * 100) + '%';
    document.getElementById('wsScore').textContent = t('score') + ' ' + W.score + ' / ' + W.total;

    const pane = document.getElementById('wsPane');
    pane.innerHTML = '<div class="ws-q"></div><div id="wsOpts"></div>' +
      '<div class="ws-nav">' +
        '<button class="ws-next" id="wsNext" disabled style="opacity:.45">' + t('continueBtn') + '</button>' +
        '<button class="ws-close" id="wsClose">' + t('closeBtn') + '</button>' +
      '</div>';
    pane.querySelector('.ws-q').textContent = it.q;

    const box = document.getElementById('wsOpts');
    it.o.forEach((txt, idx) => {
      const b = document.createElement('button');
      b.className = 'ws-opt';
      b.textContent = txt;
      b.onclick = () => {
        if (W.locked) return;
        W.locked = true;
        const all = box.querySelectorAll('.ws-opt');
        for (let k = 0; k < all.length; k++) all[k].disabled = true;
        b.classList.add(idx === it.a ? 'ok' : 'no');
        if (idx !== it.a) all[it.a].classList.add('ok');
        W.total++;
        if (idx === it.a) W.score++;
        document.getElementById('wsScore').textContent = t('score') + ' ' + W.score + ' / ' + W.total;
        const note = document.createElement('div');
        note.className = 'ws-note';
        note.innerHTML = '<b>' + t('solution') + '</b>' + it.n;
        box.appendChild(note);
        const nx = document.getElementById('wsNext');
        nx.disabled = false;
        nx.style.opacity = '1';
        ovl.scrollTop = ovl.scrollHeight;
      };
      box.appendChild(b);
    });

    const nextBtn = document.getElementById('wsNext');
    if (W.i === L.length - 1) {
      nextBtn.textContent = W.sheet === 1 ? t('nextSheet') : t('finishBtn');
    } else {
      nextBtn.textContent = t('continueBtn');
    }
    nextBtn.onclick = next;
    document.getElementById('wsClose').onclick = close;
  }

  function next() {
    const L = getQuestions();
    W.i++;
    if (W.i < L.length) {
      ovl.scrollTop = 0;
      render();
      return;
    }
    if (W.sheet === 1) {
      W.sheet = 2;
      W.i = 0;
      ovl.scrollTop = 0;
      render();
      return;
    }
    finish();
  }

  function finish() {
    const pct = W.total ? Math.round(W.score / W.total * 100) : 0;
    const medal = pct >= 90 ? '🥇' : pct >= 70 ? '🥈' : pct >= 50 ? '🥉' : '📚';
    document.getElementById('wsBar').style.width = '100%';
    document.getElementById('wsPane').innerHTML =
      '<div class="ws-done">' +
        '<div class="big">' + medal + '</div>' +
        '<h3>' + t('youFinished') + '</h3>' +
        '<p>' + t('yourScore') + ' <b>' + W.score + ' / ' + W.total + '</b> (' + pct + '%)</p>' +
      '</div>' +
      '<div class="ws-nav">' +
        '<button class="ws-next" id="wsAgain">' + t('retryBtn') + '</button>' +
        '<button class="ws-close" id="wsClose2">' + t('closeBtn') + '</button>' +
      '</div>';
    document.getElementById('wsAgain').onclick = open;
    document.getElementById('wsClose2').onclick = close;
  }

  // ===== Screen Navigation =====
  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  // ===== Init =====
  function wire() {
    const btnWorksheets = document.getElementById('btnWorksheets');
    const btnInfo = document.getElementById('btnInfo');
    const btnBack = document.getElementById('btnBack');
    const langSwitch = document.getElementById('langSwitch');

    if (btnWorksheets) btnWorksheets.addEventListener('click', open);
    if (btnInfo) btnInfo.addEventListener('click', () => showScreen('screen-info'));
    if (btnBack) btnBack.addEventListener('click', () => showScreen('screen-home'));

    if (langSwitch) {
      langSwitch.value = currentLang;
      langSwitch.addEventListener('change', (e) => {
        setLanguage(e.target.value);
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      wire();
      setLanguage(currentLang);
    });
  } else {
    wire();
    setLanguage(currentLang);
  }

  window.openWorksheets = open;
})();
</script>

</body>
</html>
