<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>غرف المواد — PlayVerse</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a1a; --card-bg:#151528; --accent:#7c3aed; --accent2:#06b6d4;
  --gold:#f59e0b; --green:#10b981; --pink:#ec4899; --red:#ef4444;
  --text:#e2e8f0; --text-dim:#94a3b8; --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo','Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* خلفية متحركة */
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.22;animation:drift 22s ease-in-out infinite}
.orb1{width:280px;height:280px;background:var(--accent);top:-60px;right:-60px}
.orb2{width:240px;height:240px;background:var(--accent2);bottom:-50px;left:-50px;animation-delay:-8s}
.orb3{width:200px;height:200px;background:var(--gold);top:45%;left:45%;animation-delay:-14s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,-24px) scale(1.14)}}

.wrap{position:relative;z-index:2;max-width:920px;margin:0 auto;padding:16px 14px 40px}

/* رأس الصفحة */
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.back{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:var(--text);
  border-radius:12px;padding:9px 14px;font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;transition:.2s}
.back:hover{background:rgba(255,255,255,.16)}
.back:active{transform:scale(.95)}
h1{font-size:clamp(1.2rem,4.6vw,1.9rem);font-weight:900;
  background:linear-gradient(135deg,var(--gold),var(--accent2));-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent;line-height:1.5}
.sub{color:var(--text-dim);font-size:.82rem;margin-top:2px}

/* شبكة البطاقات */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.card{background:var(--card-bg);border:2px solid rgba(255,255,255,.08);border-radius:var(--radius);
  padding:16px 12px;text-align:center;cursor:pointer;transition:.25s;position:relative;overflow:hidden;
  opacity:0;animation:pop .45s forwards}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.95)}100%{opacity:1;transform:none}}
.card:hover{transform:translateY(-4px);border-color:var(--c,var(--accent));box-shadow:0 8px 26px rgba(0,0,0,.5)}
.card:active{transform:scale(.97)}
.card::after{content:'';position:absolute;top:0;left:-70%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);
  transform:skewX(-20deg);animation:shine 5s infinite}
@keyframes shine{0%{left:-70%}55%,100%{left:130%}}
.ic{font-size:2rem;display:block;margin-bottom:6px}
.nm{font-weight:900;font-size:.98rem;color:var(--text)}
.dsc{font-size:.7rem;color:var(--text-dim);margin-top:3px;line-height:1.6}
.pill{display:inline-block;margin-top:7px;font-size:.66rem;font-weight:700;padding:2px 9px;border-radius:20px;
  background:rgba(255,255,255,.08);color:var(--text-dim)}

/* أقسام الغرفة */
.sec{margin-top:22px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:7px;
  border-bottom:2px solid rgba(255,255,255,.08)}
.sec-h .e{font-size:1.3rem}
.sec-h .t{font-weight:900;font-size:1.02rem}
.sec-h .n{margin-inline-start:auto;font-size:.72rem;color:var(--text-dim)}

.item{display:flex;align-items:center;gap:11px;background:var(--card-bg);
  border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:11px 13px;margin-bottom:8px;
  cursor:pointer;transition:.2s;text-decoration:none;color:inherit}
.item:hover{border-color:var(--c,var(--accent));transform:translateX(-4px)}
.item .ii{flex-shrink:0;width:42px;height:42px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:1.25rem;background:rgba(255,255,255,.06)}
.item .it{flex:1;min-width:0}
.item .it b{display:block;font-size:.92rem;font-weight:700}
.item .it span{display:block;font-size:.72rem;color:var(--text-dim);margin-top:2px;line-height:1.5}
.item .go{flex-shrink:0;color:var(--text-dim);font-size:1.1rem}

.empty{text-align:center;padding:26px 14px;color:var(--text-dim);
  background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.14);border-radius:14px;
  font-size:.85rem;line-height:1.9}
.empty .big{font-size:2.1rem;display:block;margin-bottom:6px;opacity:.6}

.pg{display:none}
.pg.on{display:block;animation:fadeIn .35s}
@keyframes fadeIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}

/* ============ SPARK STYLES ============ */
.spark-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
@media (max-width:480px){.spark-grid{grid-template-columns:1fr}}

.spark-room-card{background:linear-gradient(135deg,rgba(236,72,153,.15),rgba(168,85,247,.15));
  border:2px solid rgba(236,72,153,.3);border-radius:16px;padding:18px;cursor:pointer;
  transition:all .3s;position:relative;overflow:hidden}
.spark-room-card::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(135deg,rgba(236,72,153,.1),transparent);opacity:0;
  transition:opacity .3s}
.spark-room-card:hover{transform:translateY(-4px);border-color:var(--pink);
  box-shadow:0 12px 30px rgba(236,72,153,.2)}
.spark-room-card:hover::before{opacity:1}
.spark-room-card .rc-icon{font-size:2.2rem;display:block;margin-bottom:8px;z-index:2;position:relative}
.spark-room-card .rc-name{font-weight:700;font-size:1rem;margin-bottom:4px;color:var(--text);z-index:2;position:relative}
.spark-room-card .rc-info{font-size:.75rem;color:var(--text-dim);line-height:1.5;z-index:2;position:relative}

/* CHAT SECTION */
.chat-box{background:rgba(21,21,40,.8);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:12px;margin-top:16px;max-height:300px;display:flex;flex-direction:column}
.chat-title{font-size:.85rem;font-weight:700;color:var(--gold);margin-bottom:8px}
.chat-msgs{flex:1;overflow-y:auto;margin-bottom:8px;max-height:200px}
.chat-msg{background:rgba(255,255,255,.06);border-left:3px solid var(--pink);
  padding:6px 10px;margin-bottom:6px;border-radius:4px;font-size:.78rem;line-height:1.4}
.chat-input{display:flex;gap:6px}
.chat-input input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  color:var(--text);padding:6px 8px;border-radius:6px;font-size:.8rem;font-family:inherit}
.chat-input input:focus{outline:none;border-color:var(--pink)}
.chat-input button{background:var(--pink);color:#fff;border:none;padding:6px 10px;
  border-radius:6px;cursor:pointer;font-size:.75rem;font-weight:700;transition:.2s}
.chat-input button:hover{opacity:.8}

/* VOICE SECTION */
.voice-box{background:rgba(21,21,40,.8);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:12px;margin-top:12px}
.voice-title{font-size:.85rem;font-weight:700;color:var(--gold);margin-bottom:8px}
.voice-btn{width:100%;background:var(--pink);color:#fff;border:none;padding:8px;
  border-radius:8px;cursor:pointer;font-weight:700;font-size:.85rem;transition:.2s;
  margin-bottom:8px}
.voice-btn:hover{opacity:.85}
.voice-btn.recording{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

.project-info{background:rgba(21,21,40,.8);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:12px;margin-top:12px;font-size:.8rem}
.project-info label{display:block;color:var(--gold);font-weight:700;margin-top:8px;margin-bottom:3px}
.project-info input,
.project-info textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  color:var(--text);padding:6px 8px;border-radius:6px;font-family:inherit;font-size:.8rem;resize:vertical}
.project-info textarea{min-height:60px;max-height:100px}
.project-info input:focus,
.project-info textarea:focus{outline:none;border-color:var(--pink)}

/* SPARK ROOM DETAIL PAGE */
.spark-room-detail{margin-top:20px}
.spark-room-detail .sec{margin-top:14px}

/* NAV BUTTONS */
.nav-btn{
  transition:all .3s;
  border:none;
  font-family:inherit;
}
.nav-btn:hover{
  transform:translateY(-6px);
  box-shadow:0 12px 30px rgba(0,0,0,.4);
}
.nav-btn:active{
  transform:scale(.95);
}
</style>
</head>
<body>
<div class="bg-fx"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>

<div class="wrap">

  <!-- NAVIGATION TABS -->
  <div id="pgTabs" class="pg on">
    <div class="top">
      <button class="back" onclick="location.href='index.html'">🏠 الرئيسية</button>
      <div><h1>غرف PlayVerse</h1><div class="sub">اختر ما تريد</div></div>
    </div>
    
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">
      <button class="nav-btn" onclick="showSparkRooms()" style="background:linear-gradient(135deg,#ec4899,#f472b6);padding:20px;border:2px solid #ec4899;border-radius:14px;color:white;font-weight:700;font-size:1.05rem;cursor:pointer;transition:.3s">
        ✨ Spark<br><span style="font-size:.8rem;opacity:.8">غرفة الإبداع</span>
      </button>
      <button class="nav-btn" onclick="showSubjects()" style="background:linear-gradient(135deg,#f59e0b,#fbbf24);padding:20px;border:2px solid #f59e0b;border-radius:14px;color:#000;font-weight:700;font-size:1.05rem;cursor:pointer;transition:.3s">
        📚 المواد<br><span style="font-size:.8rem;opacity:.8">غرف المناهج</span>
      </button>
    </div>
  </div>

  <!-- SPARK غرفة الإبداع -->
  <div id="pgSpark" class="pg">
    <div class="top">
      <button class="back" onclick="showTabs()">🏠 القائمة</button>
      <div><h1>✨ Spark — غرفة الإبداع</h1><div class="sub">اختر غرفة للعمل الجماعي</div></div>
    </div>
    <div class="spark-grid" id="sparkGrid"></div>
  </div>

  <!-- تفاصيل غرفة Spark -->
  <div id="pgSparkRoom" class="pg">
    <div class="top">
      <button class="back" onclick="backFromSparkRoom()">🔙 الإبداع</button>
      <div><h1 id="sparkRoomTitle">✨ الغرفة</h1><div class="sub" id="sparkRoomSub">غرفة عمل جماعية</div></div>
    </div>

    <div class="spark-room-detail">
      <!-- Project Info -->
      <div class="project-info">
        <label>📋 اسم المشروع</label>
        <input type="text" id="projectName" placeholder="أدخل اسم المشروع..." onchange="saveSparkRoom()">
        
        <label>🎯 الأهداف</label>
        <textarea id="projectGoals" placeholder="اكتب الأهداف..." onchange="saveSparkRoom()"></textarea>
        
        <label>✅ الإجراءات</label>
        <textarea id="projectActions" placeholder="اكتب الإجراءات..." onchange="saveSparkRoom()"></textarea>
      </div>

      <!-- Chat -->
      <div class="chat-box">
        <div class="chat-title">💬 الدردشة الجماعية</div>
        <div class="chat-msgs" id="sparkChatMsgs"></div>
        <div class="chat-input">
          <input type="text" id="sparkChatInput" placeholder="اكتب رسالتك..." autocomplete="off">
          <button onclick="sendSparkMessage()">إرسال</button>
        </div>
      </div>

      <!-- Voice -->
      <div class="voice-box">
        <div class="voice-title">🎤 التسجيل الصوتي</div>
        <button class="voice-btn" id="sparkVoiceBtn" onclick="toggleSparkVoice()">⏺️ ابدأ</button>
        <div id="sparkRecordings"></div>
      </div>
    </div>
  </div>

  <!-- المواد -->
  <div id="pgSubjects" class="pg">
    <div class="top">
      <button class="back" onclick="location.href='index.html'">🏠 الرئيسية</button>
      <div><h1>📚 غرف المواد</h1><div class="sub">اختر المادة ثم الصف</div></div>
    </div>
    <div class="grid" id="subjGrid"></div>
  </div>

  <!-- الصفوف -->
  <div id="pgGrades" class="pg">
    <div class="top">
      <button class="back" onclick="showSubjects()">🔙 المواد</button>
      <div><h1 id="gradeTitle"></h1><div class="sub" id="gradeSub"></div></div>
    </div>
    <div class="grid" id="gradeGrid"></div>
  </div>

  <!-- الغرفة -->
  <div id="pgRoom" class="pg">
    <div class="top">
      <button class="back" onclick="backToGrades()">🔙 الصفوف</button>
      <div><h1 id="roomTitle"></h1><div class="sub" id="roomSub"></div></div>
    </div>

    <div class="sec">
      <div class="sec-h"><span class="e">🎬</span><span class="t">فيديوهات تحفيزية</span><span class="n" id="vidN"></span></div>
      <div id="vidList"></div>
    </div>

    <div class="sec">
      <div class="sec-h"><span class="e">🎮</span><span class="t">ألعاب تعليمية</span><span class="n" id="gameN"></span></div>
      <div id="gameList"></div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   ✏️  لإضافة محتوى: اكتبي السطر داخل المادة والصف المناسبين.
   videos: [ {t:"اسم الفيديو", d:"وصف قصير", url:"my_video.mp4"} ]
   games:  [ {t:"اسم اللعبة",  d:"وصف قصير", url:"my_game.html"} ]
   ============================================================ */

var CONTENT = {
  // مثال جاهز — احذفيه أو عدّليه:
  "bio-10": {
    games: [
      { t:"عالم اللومو والنواة السحرية", d:"الخلية الحيوانية والنباتية والانقسام", url:"lumo.html" },
      { t:"بابجينو — مملكة الطلائعيات", d:"تصنيف الطلائعيات وأمراضها", url:"babgino.html" }
    ]
  },
  "ar-10": {
    games: [ { t:"القصر الملعون", d:"التصغير والقواعس العربية", url:"castle.html" } ]
  }
};

var SUBJECTS = [
  { k:"pre",   n:"ما قبل المدرسة", ic:"🧸", c:"#ec4899", grades:["عام"],                          gk:["gen"] },
  { k:"kg1",   n:"روضة أولى KG1",  ic:"🎨", c:"#f472b6", grades:["عام"],                          gk:["gen"] },
  { k:"kg2",   n:"روضة ثانية KG2", ic:"🖍️", c:"#fb7185", grades:["عام"],                          gk:["gen"] },
  { k:"sci",   n:"علوم",           ic:"🔬", c:"#10b981", grades:g(1,8),  gk:gk(1,8) },
  { k:"bio",   n:"أحياء",          ic:"🧬", c:"#34d399", grades:g(10,11),gk:gk(10,11) },
  { k:"chem",  n:"كيمياء",         ic:"⚗️", c:"#06b6d4", grades:g(9,11), gk:gk(9,11) },
  { k:"math",  n:"رياضيات",        ic:"➗", c:"#f59e0b", grades:g(1,11), gk:gk(1,11) },
  { k:"ar",    n:"لغة عربية",      ic:"📖", c:"#7c3aed", grades:g(1,11), gk:gk(1,11) },
  { k:"en",    n:"إنجليزي",        ic:"🔤", c:"#3b82f6", grades:g(1,11), gk:gk(1,11) },
  { k:"soc",   n:"اجتماعيات",      ic:"🌍", c:"#eab308", grades:g(1,11), gk:gk(1,11) },
  { k:"rel",   n:"تربية إسلامية",  ic:"🕌", c:"#22c55e", grades:g(1,11), gk:gk(1,11) }
];

function g(a,b){ var o=[]; for(var i=a;i<=b;i++) o.push("الصف "+arNum(i)); return o; }
function gk(a,b){ var o=[]; for(var i=a;i<=b;i++) o.push(String(i)); return o; }
function arNum(n){
  var names={1:"الأول",2:"الثاني",3:"الثالث",4:"الرابع",5:"الخامس",6:"السادس",
             7:"السابع",8:"الثامن",9:"التاسع",10:"العاشر",11:"الحادي عشر"};
  return names[n]||n;
}

var curSubj = null;
var curSparkRoom = null;
var mediaRecorder = null;
var isRecording = false;
var audioChunks = [];

// ============ SPARK ============
var SPARK_ROOMS = [
  { id:1, icon:"🧸", data:{name:"",goals:"",actions:"",chat:[],recordings:[]} },
  { id:2, icon:"🎨", data:{name:"",goals:"",actions:"",chat:[],recordings:[]} },
  { id:3, icon:"🖍️", data:{name:"",goals:"",actions:"",chat:[],recordings:[]} },
  { id:4, icon:"🔬", data:{name:"",goals:"",actions:"",chat:[],recordings:[]} },
  { id:5, icon:"🧬", data:{name:"",goals:"",actions:"",chat:[],recordings:[]} },
  { id:6, icon:"⚗️", data:{name:"",goals:"",actions:"",chat:[],recordings:[]} },
  { id:7, icon:"➗", data:{name:"",goals:"",actions:"",chat:[],recordings:[]} },
  { id:8, icon:"📖", data:{name:"",goals:"",actions:"",chat:[],recordings:[]} },
  { id:9, icon:"🔤", data:{name:"",goals:"",actions:"",chat:[],recordings:[]} },
  { id:10, icon:"🌍", data:{name:"",goals:"",actions:"",chat:[],recordings:[]} },
  { id:11, icon:"🕌", data:{name:"",goals:"",actions:"",chat:[],recordings:[]} }
];

function loadSparkRooms(){
  var stored = localStorage.getItem('sparkRooms');
  if(stored){
    try{ SPARK_ROOMS = JSON.parse(stored); }catch(e){}
  }
}

function saveSparkRooms(){
  localStorage.setItem('sparkRooms',JSON.stringify(SPARK_ROOMS));
}

function showTabs(){
  show('pgTabs');
}

function showSparkRooms(){
  loadSparkRooms();
  var grid = document.getElementById('sparkGrid'), h='';
  for(var i=0;i<SPARK_ROOMS.length;i++){
    var r = SPARK_ROOMS[i];
    var displayName = r.data.name || ('غرفة '+(i+1));
    h += '<div class="spark-room-card" onclick="openSparkRoom('+r.id+'" style="animation-delay:'+(i*0.1)+'s">'
      +'<div class="rc-icon">'+r.icon+'</div>'
      +'<div class="rc-name" style="max-height:40px;overflow:hidden;word-break:break-word">'+displayName+'</div>'
      +'<div class="rc-info">'+(r.data.name ? 'اضغط للفتح' : 'مشروع جديد')+'</div>'
      +'</div>';
  }
  grid.innerHTML = h;
  show('pgSpark');
}

function openSparkRoom(rid){
  loadSparkRooms();
  var r = null;
  for(var i=0;i<SPARK_ROOMS.length;i++) if(SPARK_ROOMS[i].id===rid) r=SPARK_ROOMS[i];
  if(!r) return;
  curSparkRoom = r;
  document.getElementById('sparkRoomTitle').textContent = r.icon+' غرفة '+(r.id);
  document.getElementById('sparkRoomSub').textContent = r.data.name || 'غرفة عمل جماعية';
  
  document.getElementById('projectName').value = r.data.name || '';
  document.getElementById('projectGoals').value = r.data.goals || '';
  document.getElementById('projectActions').value = r.data.actions || '';
  
  renderSparkChat();
  renderSparkRecordings();
  
  requestMic();
  show('pgSparkRoom');
}

function backFromSparkRoom(){
  showTabs();
}

function saveSparkRoom(){
  if(!curSparkRoom) return;
  curSparkRoom.data.name = document.getElementById('projectName').value;
  curSparkRoom.data.goals = document.getElementById('projectGoals').value;
  curSparkRoom.data.actions = document.getElementById('projectActions').value;
  saveSparkRooms();
}

function renderSparkChat(){
  var box = document.getElementById('sparkChatMsgs');
  var msgs = curSparkRoom.data.chat || [];
  var h = '';
  for(var i=0;i<msgs.length;i++){
    h += '<div class="chat-msg">'+esc(msgs[i])+'</div>';
  }
  box.innerHTML = h;
  box.scrollTop = box.scrollHeight;
}

function sendSparkMessage(){
  var inp = document.getElementById('sparkChatInput');
  var txt = inp.value.trim();
  if(!txt || !curSparkRoom) return;
  curSparkRoom.data.chat.push(txt);
  inp.value = '';
  saveSparkRooms();
  renderSparkChat();
}

function toggleSparkVoice(){
  if(!mediaRecorder){
    alert('الميكروفون غير متاح');
    return;
  }
  var btn = document.getElementById('sparkVoiceBtn');
  if(!isRecording){
    audioChunks = [];
    mediaRecorder.start();
    isRecording = true;
    btn.textContent = '⏹️ إيقاف';
    btn.classList.add('recording');
  } else {
    mediaRecorder.stop();
    isRecording = false;
    btn.textContent = '⏺️ ابدأ';
    btn.classList.remove('recording');
    mediaRecorder.onstop = function(){
      var blob = new Blob(audioChunks,{type:'audio/webm'});
      var url = URL.createObjectURL(blob);
      if(!curSparkRoom.data.recordings) curSparkRoom.data.recordings = [];
      curSparkRoom.data.recordings.push({url:url,time:new Date().toLocaleTimeString('ar-SA')});
      saveSparkRooms();
      renderSparkRecordings();
    };
  }
}

function renderSparkRecordings(){
  var box = document.getElementById('sparkRecordings');
  var recs = (curSparkRoom && curSparkRoom.data.recordings) || [];
  var h = '';
  for(var i=0;i<recs.length;i++){
    h += '<div style="background:rgba(255,255,255,.05);padding:6px 8px;border-radius:6px;'
      +'margin-top:6px;display:flex;justify-content:space-between;align-items:center;font-size:.75rem">'
      +'<span>'+recs[i].time+'</span>'
      +'<button onclick="playSparkAudio(\''+recs[i].url+'\')" '
      +'style="background:var(--pink);color:#fff;border:none;padding:4px 8px;border-radius:4px;'
      +'cursor:pointer;font-size:.7rem">▶ تشغيل</button>'
      +'</div>';
  }
  box.innerHTML = h || '<div style="color:var(--text-dim);font-size:.75rem">لا توجد تسجيلات بعد</div>';
}

function playSparkAudio(url){
  var audio = new Audio(url);
  audio.play().catch(function(){alert('خطأ في التشغيل')});
}

function requestMic(){
  if(!mediaRecorder){
    navigator.mediaDevices.getUserMedia({audio:true})
      .then(function(stream){
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = function(e){ audioChunks.push(e.data); };
      })
      .catch(function(){ console.log('لا يمكن الوصول للميكروفون'); });
  }
}

// ============ SUBJECTS ============
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function show(id){
  var ps=document.querySelectorAll('.pg');
  for(var i=0;i<ps.length;i++) ps[i].classList.remove('on');
  document.getElementById(id).classList.add('on');
  window.scrollTo(0,0);
}

function showSubjects(){
  var el=document.getElementById('subjGrid'), h='';
  for(var i=0;i<SUBJECTS.length;i++){
    var s=SUBJECTS[i];
    h+='<div class="card" style="--c:'+s.c+';animation-delay:'+(i*0.04)+'s" onclick="openSubject(\''+s.k+'\')">'
      +'<span class="ic">'+s.ic+'</span>'
      +'<div class="nm">'+s.n+'</div>'
      +'<span class="pill">'+s.grades.length+' غرفة</span>'
      +'</div>';
  }
  el.innerHTML=h;
  
  // إضافة زر الرجوع للتبز
  var subjPage = document.getElementById('pgSubjects');
  var topBtn = subjPage.querySelector('.back');
  if(topBtn) topBtn.onclick = function(){ showTabs(); };
  
  show('pgSubjects');
}

function openSubject(k){
  var s=null;
  for(var i=0;i<SUBJECTS.length;i++) if(SUBJECTS[i].k===k) s=SUBJECTS[i];
  if(!s) return;
  curSubj=s;
  document.getElementById('gradeTitle').textContent=s.ic+' '+s.n;
  document.getElementById('gradeSub').textContent='اختر الصف';
  var h='';
  for(var j=0;j<s.grades.length;j++){
    var gname=s.grades[j], gkey=s.gk[j];
    var c=countRoom(s.k+'-'+gkey);
    h+='<div class="card" style="--c:'+s.c+';animation-delay:'+(j*0.035)+'s" onclick="openRoom(\''+gkey+'\')">'
      +'<span class="ic">'+s.ic+'</span>'
      +'<div class="nm">'+gname+'</div>'
      +'<div class="dsc">'+(c ? (c+' عنصر') : 'قريباً')+'</div>'
      +'</div>';
  }
  document.getElementById('gradeGrid').innerHTML=h;
  show('pgGrades');
}
function backToGrades(){ if(curSubj) openSubject(curSubj.k); else showSubjects(); }

function countRoom(key){
  var r=CONTENT[key]; if(!r) return 0;
  return ((r.videos&&r.videos.length)||0)+((r.games&&r.games.length)||0);
}

function openRoom(gkey){
  var s=curSubj; if(!s) return;
  var idx=s.gk.indexOf(gkey);
  var gname=idx>=0 ? s.grades[idx] : '';
  document.getElementById('roomTitle').textContent=s.ic+' '+s.n;
  document.getElementById('roomSub').textContent=gname;

  var r=CONTENT[s.k+'-'+gkey]||{};
  renderList('vidList','vidN',r.videos,'🎬',s.c,'لم تُضف فيديوهات لهذه الغرفة بعد');
  renderList('gameList','gameN',r.games,'🎮',s.c,'لم تُضف ألعاب لهذه الغرفة بعد');
  show('pgRoom');
}

function renderList(listId,countId,arr,icon,color,emptyMsg){
  var box=document.getElementById(listId), cn=document.getElementById(countId);
  if(!arr||!arr.length){
    cn.textContent='0';
    box.innerHTML='<div class="empty"><span class="big">'+icon+'</span>'+emptyMsg+'<br><small style="opacity:.7">قريباً بإذن الله</small></div>';
    return;
  }
  cn.textContent=arr.length;
  var h='';
  for(var i=0;i<arr.length;i++){
    var it=arr[i];
    h+='<a class="item" style="--c:'+color+'" href="'+esc(it.url)+'">'
      +'<div class="ii">'+icon+'</div>'
      +'<div class="it"><b>'+esc(it.t)+'</b><span>'+esc(it.d||'')+'</span></div>'
      +'<div class="go">‹</div></a>';
  }
  box.innerHTML=h;
}

// INIT
showTabs();
</script>
