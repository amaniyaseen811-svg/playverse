<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Spark - منصة الإبداع المتقدمة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'Tajawal', sans-serif;
  background: radial-gradient(circle at center, #1a2a4d 0%, #0f0f2e 50%, #000 100%);
  color: #fff;
  direction: rtl;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  perspective: 1000px;
}

/* ===== CONTAINER ===== */
.main-container {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ===== PARTICLES ===== */
.particles {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  pointer-events: none;
}

.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  background: radial-gradient(circle, rgba(255,140,66,0.8), transparent);
  border-radius: 50%;
  animation: float-particle 6s infinite ease-in-out;
  box-shadow: 0 0 10px rgba(255,140,66,0.4);
}

@keyframes float-particle {
  0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.8; }
  50% { transform: translateY(-50px) translateX(30px) scale(0.5); opacity: 0.3; }
}

/* ===== ROTATING ICONS CONTAINER ===== */
.rotating-container {
  position: relative;
  width: 500px;
  height: 500px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ===== LOGO CENTER ===== */
.logo-center {
  position: absolute;
  width: 180px;
  height: 180px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
  animation: pulse-glow 2s ease-in-out infinite, float-center 3s ease-in-out infinite;
}

.logo-text {
  font-size: 80px;
  font-weight: 900;
  background: linear-gradient(135deg, #FF8C42 0%, #FF1493 50%, #1E90FF 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px rgba(255,140,66,0.5);
  animation: rotate-text 20s linear infinite;
  filter: drop-shadow(0 0 20px rgba(255,140,66,0.6))
          drop-shadow(0 0 40px rgba(30,144,255,0.3));
}

.logo-subtitle {
  font-size: 14px;
  color: #FFB366;
  margin-top: 10px;
  letter-spacing: 3px;
  font-weight: 700;
  animation: fade-in-out 2s ease-in-out infinite;
}

.logo-glow {
  position: absolute;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,140,66,0.4), transparent);
  filter: blur(20px);
  animation: glow-pulse 2s ease-in-out infinite;
  box-shadow: 0 0 60px rgba(255,140,66,0.5),
              0 0 100px rgba(30,144,255,0.3),
              inset 0 0 60px rgba(255,140,66,0.2);
}

@keyframes pulse-glow {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 60px rgba(255,140,66,0.5),
                         0 0 100px rgba(30,144,255,0.3); }
  50% { box-shadow: 0 0 80px rgba(255,140,66,0.7),
                    0 0 140px rgba(30,144,255,0.5); }
}

@keyframes float-center {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

@keyframes rotate-text {
  0% { transform: rotateZ(0deg); }
  100% { transform: rotateZ(360deg); }
}

@keyframes fade-in-out {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* ===== ORBITING ICONS ===== */
.icon-orbit {
  position: absolute;
  width: 450px;
  height: 450px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: rotate-orbit 30s linear infinite;
}

@keyframes rotate-orbit {
  0% { transform: translate(-50%, -50%) rotate(0deg); }
  100% { transform: translate(-50%, -50%) rotate(360deg); }
}

.orbiting-icon {
  position: absolute;
  width: 60px;
  height: 60px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 40px;
  cursor: pointer;
  transition: all 0.3s;
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,140,66,0.2);
  animation: icon-pulse 2s ease-in-out infinite;
}

@keyframes icon-pulse {
  0%, 100% { box-shadow: 0 0 15px rgba(255,140,66,0.3); }
  50% { box-shadow: 0 0 30px rgba(255,140,66,0.6); }
}

.orbiting-icon:hover {
  transform: scale(1.3) !important;
  background: rgba(255,140,66,0.15);
  border-color: rgba(255,140,66,0.8);
  box-shadow: 0 0 40px rgba(255,140,66,0.8), inset 0 0 20px rgba(255,140,66,0.3) !important;
  filter: drop-shadow(0 0 15px rgba(255,140,66,0.8));
}

.orbiting-icon:active {
  transform: scale(1.1) !important;
}

/* Position each icon in the orbit */
.icon-1 { top: 0%; left: 50%; transform: translate(-50%, -50%); }
.icon-2 { top: 19.1%; left: 80.9%; transform: translate(-50%, -50%); }
.icon-3 { top: 50%; left: 100%; transform: translate(-50%, -50%); }
.icon-4 { top: 80.9%; left: 80.9%; transform: translate(-50%, -50%); }
.icon-5 { top: 100%; left: 50%; transform: translate(-50%, -50%); }
.icon-6 { top: 80.9%; left: 19.1%; transform: translate(-50%, -50%); }
.icon-7 { top: 50%; left: 0%; transform: translate(-50%, -50%); }
.icon-8 { top: 19.1%; left: 19.1%; transform: translate(-50%, -50%); }

/* ===== ROOM DETAILS ===== */
.room-details {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  animation: slide-up 0.5s ease forwards;
}

@keyframes slide-up {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.room-details.show {
  opacity: 1;
  pointer-events: auto;
}

.room-name {
  font-size: 28px;
  font-weight: 900;
  color: #FF8C42;
  margin-bottom: 10px;
}

.room-info {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px;
  background: rgba(255,255,255,0.05);
  padding: 20px 40px;
  border-radius: 12px;
  border: 2px solid rgba(255,140,66,0.2);
  backdrop-filter: blur(10px);
}

.info-item {
  text-align: center;
}

.info-label {
  font-size: 12px;
  color: #b8c7e0;
  margin-bottom: 5px;
}

.info-value {
  font-size: 14px;
  color: #FFB366;
  font-weight: 700;
}

/* ===== CLOSE BUTTON ===== */
.close-details {
  position: absolute;
  top: 20px;
  left: 20px;
  background: rgba(255,107,107,0.2);
  border: 2px solid #ff6b6b;
  color: #ff6b6b;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
}

.close-details.show {
  opacity: 1;
  pointer-events: auto;
}

.close-details:hover {
  background: rgba(255,107,107,0.4);
  transform: scale(1.1);
}

/* ===== TITLE TOP ===== */
.title-top {
  position: absolute;
  top: 40px;
  text-align: center;
  width: 100%;
}

.title-main {
  font-size: 36px;
  font-weight: 900;
  background: linear-gradient(90deg, #FF8C42, #FF1493, #1E90FF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 5px;
}

.subtitle {
  font-size: 14px;
  color: #b8c7e0;
  letter-spacing: 2px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .rotating-container {
    width: 350px;
    height: 350px;
  }

  .icon-orbit {
    width: 300px;
    height: 300px;
  }

  .orbiting-icon {
    width: 50px;
    height: 50px;
    font-size: 32px;
  }

  .logo-text {
    font-size: 60px;
  }

  .room-info {
    grid-template-columns: 1fr;
    padding: 15px 20px;
    gap: 10px;
  }

  .title-main {
    font-size: 24px;
  }
}

</style>
</head>
<body>

<div class="main-container">
  <!-- Particles Background -->
  <div class="particles" id="particlesContainer"></div>

  <!-- Title Top -->
  <div class="title-top">
    <div class="title-main">✨ Spark</div>
    <div class="subtitle">غرف الإبداع والابتكار</div>
  </div>

  <!-- Close Button -->
  <button class="close-details" id="closeBtn" onclick="closeRoomDetails()">✕</button>

  <!-- Rotating Container -->
  <div class="rotating-container">
    <!-- Logo Center -->
    <div class="logo-center">
      <div class="logo-glow"></div>
      <div class="logo-text">✨</div>
      <div class="logo-subtitle">Spark</div>
    </div>

    <!-- Orbiting Icons -->
    <div class="icon-orbit" id="iconOrbit">
      <div class="orbiting-icon icon-1" onclick="selectRoom('biology', '🧬', 'البيولوجيا')">🧬</div>
      <div class="orbiting-icon icon-2" onclick="selectRoom('chemistry', '⚗️', 'الكيمياء')">⚗️</div>
      <div class="orbiting-icon icon-3" onclick="selectRoom('math', '➗', 'الرياضيات')">➗</div>
      <div class="orbiting-icon icon-4" onclick="selectRoom('language', '📚', 'اللغة')">📚</div>
      <div class="orbiting-icon icon-5" onclick="selectRoom('history', '📖', 'التاريخ')">📖</div>
      <div class="orbiting-icon icon-6" onclick="selectRoom('arts', '🎨', 'الفنون')">🎨</div>
      <div class="orbiting-icon icon-7" onclick="selectRoom('drawing', '🖍️', 'الرسم')">🖍️</div>
      <div class="orbiting-icon icon-8" onclick="selectRoom('animals', '🧸', 'الحيوانات')">🧸</div>
    </div>

    <!-- Room Details -->
    <div class="room-details" id="roomDetails">
      <div class="room-name" id="roomName"></div>
      <div class="room-info">
        <div class="info-item">
          <div class="info-label">المرحلة</div>
          <div class="info-value" id="roomStage"></div>
        </div>
        <div class="info-item">
          <div class="info-label">الفريق</div>
          <div class="info-value" id="roomTeam"></div>
        </div>
        <div class="info-item">
          <div class="info-label">التقدم</div>
          <div class="info-value" id="roomProgress"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== ROOMS DATA =====
const roomsData = {
  biology: {
    icon: '🧬',
    name: 'البيولوجيا',
    stage: 'متقدمة',
    team: '4 أعضاء',
    progress: '65%'
  },
  chemistry: {
    icon: '⚗️',
    name: 'الكيمياء',
    stage: 'أساسية',
    team: '3 أعضاء',
    progress: '50%'
  },
  math: {
    icon: '➗',
    name: 'الرياضيات',
    stage: 'أساسية',
    team: '4 أعضاء',
    progress: '75%'
  },
  language: {
    icon: '📚',
    name: 'اللغة العربية',
    stage: 'متقدمة',
    team: '3 أعضاء',
    progress: '80%'
  },
  history: {
    icon: '📖',
    name: 'التاريخ',
    stage: 'متقدمة',
    team: '4 أعضاء',
    progress: '45%'
  },
  arts: {
    icon: '🎨',
    name: 'الفنون',
    stage: 'مبتدئة',
    team: '2 عضو',
    progress: '35%'
  },
  drawing: {
    icon: '🖍️',
    name: 'الرسم والتصميم',
    stage: 'متقدمة',
    team: '3 أعضاء',
    progress: '70%'
  },
  animals: {
    icon: '🧸',
    name: 'الحيوانات والطبيعة',
    stage: 'أساسية',
    team: '4 أعضاء',
    progress: '55%'
  }
};

// ===== PARTICLES GENERATOR =====
function createParticles() {
  const container = document.getElementById('particlesContainer');
  const particleCount = 50;

  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    const delay = Math.random() * 6;
    const duration = 4 + Math.random() * 4;

    particle.style.left = x + '%';
    particle.style.top = y + '%';
    particle.style.animationDelay = delay + 's';
    particle.style.animationDuration = duration + 's';

    container.appendChild(particle);
  }
}

// ===== ROOM SELECTION =====
function selectRoom(roomId, icon, name) {
  const room = roomsData[roomId];
  
  // Update UI
  document.getElementById('roomName').textContent = icon + ' ' + room.name;
  document.getElementById('roomStage').textContent = room.stage;
  document.getElementById('roomTeam').textContent = room.team;
  document.getElementById('roomProgress').textContent = room.progress;
  
  // Show details
  document.getElementById('roomDetails').classList.add('show');
  document.getElementById('closeBtn').classList.add('show');
  
  // Play sound (optional)
  playClickSound();
}

// ===== CLOSE ROOM DETAILS =====
function closeRoomDetails() {
  document.getElementById('roomDetails').classList.remove('show');
  document.getElementById('closeBtn').classList.remove('show');
}

// ===== SOUND EFFECT =====
function playClickSound() {
  // Create a simple beep sound
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = audioContext.createOscillator();
  const gainNode = audioContext.createGain();

  oscillator.connect(gainNode);
  gainNode.connect(audioContext.destination);

  oscillator.frequency.value = 800;
  oscillator.type = 'sine';

  gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

  oscillator.start(audioContext.currentTime);
  oscillator.stop(audioContext.currentTime + 0.1);
}

// ===== INITIALIZE =====
window.addEventListener('load', createParticles);

</script>

</body>
</html>
