<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Spark - غرف الإبداع</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Tajawal', sans-serif;
  background: linear-gradient(135deg, #0f0f2e 0%, #1a1a4d 100%);
  color: #fff;
  direction: rtl;
  min-height: 100vh;
  padding: 20px;
}

/* ===== HEADER ===== */
.header {
  text-align: center;
  margin-bottom: 40px;
  position: relative;
}

.logo-container {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
  animation: float 3s ease-in-out infinite;
}

.logo-glow {
  width: 180px;
  height: 180px;
  background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad1" x1="0%25" y1="0%25" x2="100%25" y2="100%25"><stop offset="0%25" style="stop-color:%23FF8C42;stop-opacity:1" /><stop offset="25%25" style="stop-color:%23FF1493;stop-opacity:1" /><stop offset="50%25" style="stop-color:%236A0DAD;stop-opacity:1" /><stop offset="75%25" style="stop-color:%231E90FF;stop-opacity:1" /><stop offset="100%25" style="stop-color:%231E90FF;stop-opacity:1" /></linearGradient></defs><circle cx="100" cy="100" r="95" stroke="url(%23grad1)" stroke-width="8" fill="white"/><g transform="translate(50,40)"><path d="M20,40 L30,10 L40,35 L50,5 L45,40 L60,30" stroke="%23FF8C42" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M50,35 L65,25 L70,45" stroke="%231E90FF" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="35" cy="25" r="2" fill="%23FFD700"/><circle cx="55" cy="20" r="2" fill="%23FF1493"/><circle cx="70" cy="15" r="2" fill="%236A0DAD"/></g><text x="100" y="140" font-size="40" font-weight="bold" text-anchor="middle" fill="%23001F4D" font-family="Arial">Spark</text></svg>') no-repeat center;
  background-size: contain;
  filter: drop-shadow(0 0 30px rgba(255, 140, 66, 0.8)) 
          drop-shadow(0 0 60px rgba(30, 144, 255, 0.6))
          drop-shadow(0 0 90px rgba(106, 13, 173, 0.4));
  box-shadow: 0 0 40px rgba(255, 140, 66, 0.6),
              0 0 80px rgba(30, 144, 255, 0.4),
              inset 0 0 40px rgba(255, 255, 255, 0.1);
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

.header h1 {
  font-size: 36px;
  background: linear-gradient(90deg, #FF8C42, #FF1493, #1E90FF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 900;
  margin-bottom: 10px;
}

.header p {
  color: #b8c7e0;
  font-size: 14px;
  letter-spacing: 2px;
}

/* ===== NAVIGATION TABS ===== */
.rooms-nav {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
  gap: 12px;
  margin-bottom: 30px;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}

.room-tab {
  padding: 12px;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,140,66,0.2);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s;
  text-align: center;
  font-size: 32px;
  font-weight: 600;
}

.room-tab:hover {
  background: rgba(255,140,66,0.15);
  border-color: rgba(255,140,66,0.6);
  transform: translateY(-4px);
}

.room-tab.active {
  background: linear-gradient(135deg, rgba(255,140,66,0.3), rgba(30,144,255,0.3));
  border-color: #FF8C42;
  box-shadow: 0 0 20px rgba(255,140,66,0.4);
}

/* ===== ROOM CONTENT ===== */
.room-container {
  max-width: 1000px;
  margin: 0 auto;
  display: none;
}

.room-container.active {
  display: block;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== ROOM CARD ===== */
.room-card {
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,140,66,0.2);
  border-radius: 20px;
  padding: 30px;
  backdrop-filter: blur(10px);
}

.room-title {
  font-size: 28px;
  font-weight: 900;
  margin-bottom: 20px;
  color: #FF8C42;
  display: flex;
  align-items: center;
  gap: 12px;
}

.room-icon {
  font-size: 36px;
}

/* ===== SECTION ===== */
.section {
  margin-bottom: 25px;
  background: rgba(255,255,255,0.03);
  padding: 15px;
  border-left: 4px solid #1E90FF;
  border-radius: 8px;
}

.section-title {
  font-size: 16px;
  font-weight: 700;
  color: #FF1493;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-icon {
  font-size: 18px;
}

.section-content {
  color: #e0e7ff;
  font-size: 14px;
  line-height: 1.6;
}

/* ===== STAGE BADGE ===== */
.stage-badge {
  display: inline-block;
  background: linear-gradient(135deg, #FF8C42, #FF1493);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 10px;
}

/* ===== TEAM MEMBERS ===== */
.team-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
}

.team-member {
  background: rgba(30,144,255,0.1);
  border: 1px solid rgba(30,144,255,0.3);
  padding: 10px;
  border-radius: 8px;
  text-align: center;
  font-size: 12px;
}

.member-emoji {
  font-size: 24px;
  margin-bottom: 5px;
  display: block;
}

.member-name {
  color: #1E90FF;
  font-weight: 600;
}

/* ===== STEPS ===== */
.steps-list {
  counter-reset: step-counter;
  list-style: none;
}

.steps-list li {
  counter-increment: step-counter;
  margin-bottom: 12px;
  padding-left: 30px;
  position: relative;
  font-size: 13px;
  color: #e0e7ff;
  line-height: 1.5;
}

.steps-list li::before {
  content: counter(step-counter);
  position: absolute;
  left: 0;
  top: -2px;
  width: 24px;
  height: 24px;
  background: linear-gradient(135deg, #FF8C42, #FF1493);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12px;
  color: white;
}

/* ===== PROGRESS BAR ===== */
.progress-section {
  margin-bottom: 20px;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 8px;
  color: #b8c7e0;
}

.progress-bar {
  width: 100%;
  height: 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid rgba(255,140,66,0.2);
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #FF8C42, #FF1493, #1E90FF);
  border-radius: 5px;
  transition: width 0.5s ease;
  box-shadow: 0 0 10px rgba(255,140,66,0.6);
}

/* ===== PRIORITY RESULT ===== */
.priority-result {
  background: linear-gradient(135deg, rgba(255,140,66,0.2), rgba(30,144,255,0.2));
  border-left: 4px solid #FF8C42;
  padding: 15px;
  border-radius: 8px;
  margin-top: 15px;
}

.priority-title {
  font-size: 13px;
  font-weight: 700;
  color: #FF8C42;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.priority-content {
  font-size: 13px;
  color: #e0e7ff;
  line-height: 1.6;
}

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.1);
  color: #888;
  font-size: 12px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .logo-glow {
    width: 120px;
    height: 120px;
  }
  
  .header h1 {
    font-size: 24px;
  }
  
  .room-card {
    padding: 20px;
  }
  
  .room-title {
    font-size: 20px;
  }
}

</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <div class="logo-container">
    <div class="logo-glow"></div>
  </div>
  <h1>✨ Spark</h1>
  <p>غرف الإبداع والابتكار</p>
</div>

<!-- ===== ROOM TABS ===== -->
<div class="rooms-nav" id="roomTabs"></div>

<!-- ===== ROOM CONTENT ===== -->
<div id="roomsContainer"></div>

<!-- ===== FOOTER ===== -->
<div class="footer">
  <p>© 2026 Spark - Creativity • Innovation • Youth</p>
</div>

<script>
const rooms = [

    team: [

      'عرض النتائج والمناقشة'
    ],
    progress: 65,
    priority: 'إنشاء نموذج ثلاثي الأبعاد للخلية يوضح جميع الأجزاء الرئيسية مع وظائفها'
  },
  {
    id: 'chemistry',
    icon: '⚗️',
    name: 'الكيمياء',
    stage: 'مرحلة أساسية',
    team: [
      { name: 'أحمد', emoji: '👨' },
      { name: 'سارة', emoji: '👩' },
      { name: 'خالد', emoji: '👦' }
    ],
    steps: [
      'دراسة العناصر والجدول الدوري',
      'فهم الروابط الكيميائية',
      'تطبيق المعادلات',
      'تجارب عملية آمنة'
    ],
    progress: 50,
    priority: 'فهم الحمض والقاعدة من خلال تجارب عملية بسيطة وآمنة'
  },
  {
    id: 'math',
    icon: '➗',
    name: 'الرياضيات',
    stage: 'مرحلة أساسية',
    team: [
      { name: 'محمد', emoji: '👦' },
      { name: 'جنى', emoji: '👧' },
      { name: 'يوسف', emoji: '👨' },
      { name: 'هناء', emoji: '👩' }
    ],
    steps: [
      'حل المعادلات الخطية',
      'فهم الأشكال الهندسية',
      'حساب المساحة والمحيط',
      'إنشاء مشاريع تطبيقية',
      'تقديم النتائج'
    ],
    progress: 75,
    priority: 'تطبيق الرياضيات في البناء والعمارة - مشروع تصميم نموذج معماري'
  },
  {
    id: 'language',
    icon: '📚',
    name: 'اللغة العربية',
    stage: 'مرحلة متقدمة',
    team: [
      { name: 'ليلى', emoji: '👧' },
      { name: 'عمر', emoji: '👦' },
      { name: 'دينا', emoji: '👩' }
    ],
    steps: [
      'دراسة النصوص الأدبية',
      'تحليل الشعر والنثر',
      'كتابة مقالات إبداعية',
      'الإلقاء والتمثيل',
      'نشر العمل'
    ],
    progress: 80,
    priority: 'إنتاج مجموعة قصص قصيرة أصلية مستوحاة من الحياة اليومية'
  },
  {
    id: 'history',
    icon: '📖',
    name: 'التاريخ',
    stage: 'مرحلة متقدمة',
    team: [
      { name: 'فاطمة', emoji: '👩' },
      { name: 'وسيم', emoji: '👨' },
      { name: 'مريم', emoji: '👧' },
      { name: 'إبراهيم', emoji: '👦' }
    ],
    steps: [
      'البحث عن أحداث تاريخية',

  },
  {

    icon: '🎨',
    name: 'الفنون',
    stage: 'مرحلة مبتدئة',
    team: [
      { name: 'لين', emoji: '👧' },
      { name: 'ياسر', emoji: '👨' }
    ],
    steps: [
      'استكشاف تقنيات الرسم المختلفة',

    ],

  },
  {
    id: 'drawing',
    icon: '🖍️',
    name: 'الرسم والتصميم',
    stage: 'مرحلة متقدمة',
    team: [
      { name: 'رنا', emoji: '👩' },
      { name: 'محسن', emoji: '👨' },
      { name: 'جود', emoji: '👧' }
    ],
    steps: [
      'تعلم أساسيات الرسم',
      'دراسة المنظور والتناسب',
      'استخدام البرامج الرقمية',
      'تصميم شخصيات وعوالم',
      'عرض المشروع النهائي'
    ],
    progress: 70,
    priority: 'تصميم رموز وشخصيات أصلية لقصة خيالية متكاملة'
  },
  {
    id: 'animals',
    icon: '🧸',
    name: 'الحيوانات والطبيعة',
    stage: 'مرحلة أساسية',

      { name: 'هيا', emoji: '👧' },
      { name: 'علاء', emoji: '👦' },
      { name: 'ريم', emoji: '👩' },
      { name: 'سلام', emoji: '👨' }
    ],
    steps: [
      'دراسة سلوك الحيوانات',

      'البحث الميداني والملاحظة',

    ],

    priority: 'إنتاج وثيقة شاملة عن حماية الحيوانات المهددة بالانقراض'
  }

// ===== INITIALIZE ROOMS =====
function initializeRooms() {
  const tabsContainer = document.getElementById('roomTabs');
  const contentContainer = document.getElementById('roomsContainer');

  rooms.forEach((room, index) => {
    // Create tab
    const tab = document.createElement('button');
    tab.className = `room-tab ${index === 0 ? 'active' : ''}`;
    tab.textContent = room.icon;
    tab.onclick = () => showRoom(room.id);
    tabsContainer.appendChild(tab);

    // Create room content
    const roomDiv = document.createElement('div');
    roomDiv.className = `room-container ${index === 0 ? 'active' : ''}`;
    roomDiv.id = `room-${room.id}`;
    roomDiv.innerHTML = createRoomHTML(room);
    contentContainer.appendChild(roomDiv);
  });
}

function createRoomHTML(room) {
  return `
    <div class="room-card">
      <div class="room-title">
        <span class="room-icon">${room.icon}</span>
        <span>${room.name}</span>
      </div>

      <div class="stage-badge">${room.stage}</div>

      <!-- المرحلة -->
      <div class="section">
        <div class="section-title">
          <span class="section-icon">📍</span>
          المرحلة الحالية
        </div>
        <div class="section-content">${room.stage}</div>
      </div>

      <!-- فريق العمل -->
      <div class="section">
        <div class="section-title">
          <span class="section-icon">👥</span>
          فريق العمل
        </div>
        <div class="team-list">
          ${room.team.map(member => `
            <div class="team-member">
              <span class="member-emoji">${member.emoji}</span>
              <div class="member-name">${member.name}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <!-- الخطوات -->
      <div class="section">
        <div class="section-title">
          <span class="section-icon">⚡</span>
          خطوات المشروع
        </div>
        <ul class="steps-list">
          ${room.steps.map(step => `<li>${step}</li>`).join('')}
        </ul>
      </div>

      <!-- التقدم -->
      <div class="section">
        <div class="section-title">
          <span class="section-icon">📊</span>
          التقدم
        </div>
        <div class="progress-section">
          <div class="progress-label">
            <span>الإنجاز</span>
            <span>${room.progress}%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${room.progress}%"></div>
          </div>
        </div>
      </div>

      <!-- النتيجة الأولوية -->
      <div class="priority-result">
        <div class="priority-title">
          <span>🎯</span>
          النتيجة الأولوية
        </div>
        <div class="priority-content">${room.priority}</div>
      </div>
    </div>
  `;
}

function showRoom(roomId) {
  // Hide all rooms
  document.querySelectorAll('.room-container').forEach(el => {
    el.classList.remove('active');
  });
  document.querySelectorAll('.room-tab').forEach(el => {
    el.classList.remove('active');
  });

  // Show selected room
  document.getElementById(`room-${roomId}`).classList.add('active');
  
  // Mark tab as active
  const tab = event.target;
  tab.classList.add('active');
}

// ===== INIT ===== 
window.addEventListener('load', initializeRooms);

</script>

</body>
</html>
