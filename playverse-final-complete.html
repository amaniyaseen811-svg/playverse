* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { 
  width: 100%; 
  height: 100%; 
  overflow: hidden; 
  background: #0a0a1a; 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;

/* ====== SPLASH SCREEN ====== */
#splashScreen {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(circle at center, #1a0a3e 0%, #0a0a1a 70%);
  z-index: 99999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: opacity 0.8s ease-out;
}
#splashScreen.fade-out {
  opacity: 0;
  pointer-events: none;
}

#particleCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
}

.splash-container {
  position: relative;
  z-index: 2;
  text-align: center;
}

.splash-circles {
  position: relative;
  width: 280px;
  height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 30px;
}

.circle-ring {
  position: absolute;
  border-radius: 50%;
  border: 2.5px solid;
  width: 100%;
  height: 100%;
  animation: rotateCW 20s linear infinite;
}

.circle-ring:nth-child(1) { 
  border-color: rgba(59, 130, 246, 0.85);
  width: 100%;
  animation-delay: 0s;
}
.circle-ring:nth-child(2) { 
  border-color: rgba(34, 197, 94, 0.65);
  animation-delay: -5s;
  animation-direction: reverse;
  width: 80%;
  height: 80%;
  top: 10%; left: 10%;
}
.circle-ring:nth-child(3) { 
  border-color: rgba(249, 115, 22, 0.75);
  animation-delay: -10s;
  width: 60%;
  height: 60%;
  top: 20%; left: 20%;
}
.circle-ring:nth-child(4) { 
  border-color: rgba(236, 72, 153, 0.85);
  animation-delay: -15s;
  animation-direction: reverse;
  width: 40%;
  height: 40%;
  top: 30%; left: 30%;
}

@keyframes rotateCW { 
  0% { transform: rotate(0deg); } 
  100% { transform: rotate(360deg); } 
}

.splash-glow {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  box-shadow: 
    0 0 100px rgba(59, 130, 246, 0.4), 
    inset 0 0 100px rgba(236, 72, 153, 0.15);
  animation: breathe 4s ease-in-out infinite;
}

@keyframes breathe { 
  0%, 100% { transform: scale(1); opacity: 0.6; } 
  50% { transform: scale(1.05); opacity: 1; }
}

.splash-logo {
  position: absolute;
  width: 160px;
  height: 160px;
  background: radial-gradient(circle at 35% 35%, rgba(59, 130, 246, 0.3), #000);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3;
  box-shadow: 
    0 0 60px rgba(59, 130, 246, 0.6),
    inset 0 0 40px rgba(236, 72, 153, 0.2);
  overflow: hidden;
  border: 2px solid rgba(59, 130, 246, 0.3);
}

.splash-logo img {
  width: 85%;
  height: 85%;
  object-fit: contain;
}

.splash-text {
  color: #e2e8f0;
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 20px;
  z-index: 2;
  letter-spacing: 2px;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
}

.splash-subtext {
  color: #a0aec0;
  font-size: 13px;
  margin-bottom: 35px;
  z-index: 2;
  letter-spacing: 1px;
}

.splash-btn {
  padding: 14px 36px;
  background: linear-gradient(135deg, #f59e0b 0%, #ec4899 50%, #7c3aed 100%);
  background-size: 200% 200%;
  border: none;
  border-radius: 50px;
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 0 30px rgba(245, 158, 11, 0.5), 0 10px 30px rgba(0, 0, 0, 0.3);
  animation: gradientShift 3s ease infinite, pulse 2s ease infinite;
  z-index: 2;
  font-family: inherit;
  transition: transform 0.2s;
  letter-spacing: 0.5px;
}

@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.5), 0 10px 30px rgba(0, 0, 0, 0.3); }
  50% { box-shadow: 0 0 50px rgba(245, 158, 11, 0.8), 0 15px 40px rgba(0, 0, 0, 0.4); }
}

.splash-btn:active { 
  transform: scale(0.95);
}

/* ====== FREE OFFER SCREEN ====== */
#freeOfferScreen {

  top: 0; left: 0;
  width: 100%; height: 100%;

@keyframes slideIn {

}

@keyframes slideOut {

<script>
// ====== PARTICLE ENGINE ======
class ParticleSystem {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: true, willReadFrequently: false });
    this.particles = [];
    this.time = 0;
    this.maxParticles = 150;
    
    this.resize();
    window.addEventListener('resize', () => this.resize(), { passive: true });
  }
  
  resize() {
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
  }
  
  spawnParticle(x, y, color, size = 3, life = 60) {
    if (this.particles.length >= this.maxParticles) return;
    
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.5 + Math.random() * 2;
    
    this.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 0.5,
      size,
      color,
      life,
      maxLife: life,
      alpha: 1
    });
  }
  
  spawnBurst(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
      this.spawnParticle(x, y, color, 2, 60);
    }
  }
  
  update() {
    this.time++;
    
    if (this.time % 10 === 0) {
      const zones = [
        { x: this.canvas.width * 0.2, y: this.canvas.height * 0.3 },
        { x: this.canvas.width * 0.8, y: this.canvas.height * 0.4 },
        { x: this.canvas.width * 0.5, y: this.canvas.height * 0.7 }
      ];
      const zone = zones[Math.floor(Math.random() * zones.length)];
      this.spawnBurst(zone.x, zone.y, 'rgba(255, 255, 255, 0.7)', 2);
    }
    
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.life--;
      p.alpha = p.life / p.maxLife;
      
      if (p.life <= 0) {
        this.particles.splice(i, 1);
      }
    }
  }
  
  draw() {
    this.ctx.fillStyle = 'rgba(10, 10, 26, 0.08)';
    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    
    this.particles.forEach(p => {
      this.ctx.fillStyle = p.color;
      this.ctx.globalAlpha = p.alpha;
      this.ctx.beginPath();
      this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      this.ctx.fill();
    });
    
    this.ctx.globalAlpha = 1;
  }
  
  animate() {
    this.update();
    this.draw();
    requestAnimationFrame(() => this.animate());
  }
}

splashParticles.animate();

    document.getElementById('splashScreen').style.display = 'none';
    document.getElementById('freeOfferScreen').classList.add('show');
    
    const giftCanvas = document.getElementById('giftCanvas');
    const giftParticles = new ParticleSystem(giftCanvas);
    giftParticles.animate();
  }, 800);
}

function playGiftAnimation() {
  const giftBox = event.target.closest('.gift-box');
  giftBox.style.animation = 'none';
  setTimeout(() => {
    giftBox.style.animation = 'float 3s ease-in-out infinite';
  }, 10);
}

function startMainApp() {
  document.getElementById('freeOfferScreen').classList.add('hide');
  setTimeout(() => {
    document.getElementById('freeOfferScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'flex';
    
    const appCanvas = document.getElementById('appCanvas');
    const appParticles = new ParticleSystem(appCanvas);
    appParticles.animate();
  }, 600);
}
